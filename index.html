<!DOCTYPE html>
<html lang="fr">

<meta charset="UTF-8">

<title>Pronostics CDM 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#faf9f6;--card:#ffffff;--ink:#1c1c1a;--dim:#6e6e68;--faint:#a3a39c;
  --line:#e9e8e2;--line2:#dedcd4;--accent:#3a6b4a;--accent-soft:#eef2ee;
  --fr:#3a5a8c;--ok:#3a6b4a;--ko:#9a5450;
}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-feature-settings:"tnum"}
::-webkit-scrollbar{width:0;height:0}
.app{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);position:relative}
.header{padding:24px 24px 18px;border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:100;background:rgba(250,249,246,.94);backdrop-filter:blur(10px)}
.h-row{display:flex;align-items:flex-start;justify-content:space-between}
.eyebrow{font-size:10px;letter-spacing:3px;color:var(--faint);text-transform:uppercase;font-weight:600;margin-bottom:7px}
.title{font-size:22px;font-weight:700;letter-spacing:-.4px;line-height:1}
.subtitle{font-size:12px;color:var(--dim);margin-top:7px;font-weight:400}
.who{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
.who-btn{padding:5px 11px;border:1px solid var(--line2);border-radius:30px;background:var(--card);color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.who-btn:hover{border-color:var(--ink);color:var(--ink)}
.who-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sync{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--faint);font-weight:500;white-space:nowrap}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);transition:background .3s}
.sync-dot.off{background:var(--ko)}
.sync-dot.busy{background:#d0a030;animation:bl .8s infinite}
@keyframes bl{50%{opacity:.3}}
.board{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line2)}
.board-cell{padding:15px 8px 14px;text-align:center;border-right:1px solid var(--line);position:relative}
.board-cell:last-child{border-right:none}
.board-cell.lead::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--accent)}
.b-rank{font-size:10px;color:var(--faint);font-weight:600;margin-bottom:4px}
.b-name{font-size:11px;font-weight:600;color:var(--dim);margin-bottom:6px}
.board-cell.lead .b-name{color:var(--accent)}
.b-score{font-size:26px;font-weight:700;line-height:1;color:var(--ink);letter-spacing:-.5px}
.board-cell.lead .b-score{color:var(--accent)}
.b-pct{font-size:10px;color:var(--faint);margin-top:5px;font-weight:500}
.content{flex:1;overflow-y:auto;padding-bottom:78px}
.scroller{display:flex;gap:7px;padding:16px 20px 4px;overflow-x:auto;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.chip{padding:7px 15px;border:1px solid var(--line2);border-radius:30px;background:var(--card);color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;font-family:inherit}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.scroller.sub .chip{padding:5px 12px;font-size:10px}
.slabel{display:flex;align-items:center;gap:11px;padding:18px 24px 10px}
.slabel-text{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.slabel-line{flex:1;height:1px;background:var(--line2)}
.slabel-count{font-size:10px;color:var(--faint);font-weight:600}
.card{margin:0 18px 9px;border:1px solid var(--line2);background:var(--card);border-radius:10px;overflow:hidden;transition:border-color .2s}
.card:hover{border-color:var(--line)}
.card.fr{border-left:2px solid var(--fr)}
.card-top{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.c-num{font-size:10px;color:var(--faint);font-weight:600}
.c-when{font-size:11px;color:var(--dim);font-weight:500}
.c-tag{margin-left:auto;font-size:9px;font-weight:600;letter-spacing:.8px;padding:3px 9px;background:var(--paper);border:1px solid var(--line2);color:var(--dim);border-radius:20px;text-transform:uppercase}
.c-tag.frtag{background:var(--card);border-color:var(--fr);color:var(--fr)}
.teams{display:flex;align-items:center;padding:14px}
.team{flex:1;display:flex;align-items:center;gap:9px}
.team.r{flex-direction:row-reverse;text-align:right}
.flag{font-size:22px;line-height:1}
.tname{font-size:14px;font-weight:600;line-height:1.15}
.vs{font-size:10px;color:var(--faint);padding:0 12px;font-weight:600;letter-spacing:1px}
.votes{padding:3px 14px 14px;border-top:1px solid var(--line)}
.vrow{display:flex;align-items:center;gap:10px;padding:5px 0}
.vname{font-size:11px;font-weight:600;width:56px;flex-shrink:0;color:var(--dim)}
.vname.me{color:var(--accent);font-weight:700}
.vopts{display:flex;gap:5px;flex:1}
.vbtn{flex:1;padding:7px 4px;border:1px solid var(--line2);background:var(--paper);color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .14s;font-family:inherit;border-radius:6px}
.vbtn:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.vbtn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.vbtn:disabled{cursor:default;opacity:.85}
.vbtn.locked.on{background:var(--dim);border-color:var(--dim)}
.retenu{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.rlabel{font-size:9px;font-weight:600;letter-spacing:1px;color:var(--faint);text-transform:uppercase}
.rval{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:4px 11px;border-radius:6px}
.rpending{font-size:11px;color:var(--faint);font-style:italic}
.rsel{margin-left:auto;background:var(--paper);border:1px solid var(--line2);color:var(--ink);font-size:11px;font-weight:500;padding:6px 9px;cursor:pointer;font-family:inherit;border-radius:6px}
.rsel:focus{outline:none;border-color:var(--accent)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;width:100%}
.badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px}
.badge.ok{background:var(--accent-soft);color:var(--ok)}
.badge.ko{background:#f6ecec;color:var(--ko)}
.rcard{margin:0 18px 12px;border:1px solid var(--line2);background:var(--card);border-radius:10px;overflow:hidden}
.rcard.gold{border-color:var(--accent)}
.rtop{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line)}
.rmedal{font-size:22px;width:28px;text-align:center}
.rmedal.txt{font-size:15px;font-weight:700;color:var(--faint)}
.rname{font-size:16px;font-weight:600}
.rscore{margin-left:auto;font-size:30px;font-weight:700;line-height:1;letter-spacing:-1px}
.rcard.gold .rscore{color:var(--accent)}
.runit{font-size:10px;color:var(--faint);font-weight:500;margin-left:3px}
.rbars{padding:14px 16px;display:flex;flex-direction:column;gap:11px}
.brow{display:flex;align-items:center;gap:11px}
.blabel{font-size:10px;color:var(--dim);width:84px;flex-shrink:0;letter-spacing:.3px;text-transform:uppercase;font-weight:600}
.btrack{flex:1;height:5px;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.bfill{height:100%;background:var(--accent);border-radius:20px;transition:width .7s cubic-bezier(.16,1,.3,1)}
.bfill.neutral{background:var(--dim)}
.bval{font-size:11px;color:var(--ink);width:42px;text-align:right;flex-shrink:0;font-weight:600}
.apero{margin:4px 18px 18px;border:1px solid var(--line2);border-radius:10px;padding:15px 18px;display:flex;align-items:center;gap:14px;background:var(--card)}
.apero-ico{font-size:26px}
.apero-txt{font-size:12px;color:var(--dim);line-height:1.5}
.apero-txt b{color:var(--ink);font-weight:600}
.apero-name{color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}
.scard{border:1px solid var(--line2);background:var(--card);padding:15px;border-radius:10px}
.slbl{font-size:9px;color:var(--faint);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.sval{font-size:28px;font-weight:700;line-height:.9;letter-spacing:-1px}
.sval.a{color:var(--accent)}
.ssub{font-size:10px;color:var(--faint);margin-top:7px;font-weight:500}
.rule{margin:0 18px 9px;border:1px solid var(--line2);background:var(--card);padding:13px 16px;display:flex;gap:13px;align-items:flex-start;border-radius:10px}
.rule-ico{font-size:17px;flex-shrink:0;opacity:.7}
.rule-t{font-size:12px;font-weight:600;margin-bottom:3px}
.rule-d{font-size:12px;color:var(--dim);line-height:1.4}
.banner{margin:12px 18px 0;padding:11px 14px;border:1px solid var(--line2);border-radius:8px;background:#fbf6e9;color:#7a6420;font-size:11px;font-weight:500;display:none}
.banner.show{display:block}
.nav{display:flex;background:rgba(250,249,246,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line2);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;z-index:100}
.nbtn{flex:1;padding:12px 4px 13px;background:none;border:none;color:var(--faint);cursor:pointer;transition:color .15s;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;font-family:inherit}
.nbtn.on{color:var(--ink)}
.nbtn.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:2px;background:var(--accent)}
.nbtn:hover{color:var(--dim)}.nbtn.on:hover{color:var(--ink)}
.nico{font-size:16px;line-height:1;opacity:.85}
.nlbl{font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}

</head>

];

  {id:73,date:"29/06",h:"19:00",t:"1/16",e1:"2e Gr.B",e2:"3e meilleur"},
  {id:74,date:"29/06",h:"23:00",t:"1/16",e1:"1er Gr.E",e2:"3e meilleur"},

  {id:77,date:"30/06",h:"23:00",t:"1/16",e1:"1er Gr.I",e2:"3e meilleur"},
  {id:78,date:"01/07",h:"03:00",t:"1/16",e1:"2e Gr.E",e2:"2e Gr.I"},
  {id:79,date:"01/07",h:"19:00",t:"1/16",e1:"1er Gr.A",e2:"3e meilleur"},
  {id:80,date:"01/07",h:"23:00",t:"1/16",e1:"1er Gr.L",e2:"3e meilleur"},
  {id:81,date:"02/07",h:"03:00",t:"1/16",e1:"1er Gr.D",e2:"3e meilleur"},
  {id:82,date:"02/07",h:"19:00",t:"1/16",e1:"1er Gr.G",e2:"3e meilleur"},
  {id:83,date:"02/07",h:"23:00",t:"1/16",e1:"2e Gr.K",e2:"2e Gr.L"},
  {id:84,date:"03/07",h:"03:00",t:"1/16",e1:"1er Gr.H",e2:"2e Gr.J"},
  {id:85,date:"03/07",h:"19:00",t:"1/16",e1:"1er Gr.B",e2:"3e meilleur"},
  {id:86,date:"03/07",h:"23:00",t:"1/16",e1:"1er Gr.J",e2:"2e Gr.H"},
  {id:87,date:"04/07",h:"03:00",t:"1/16",e1:"1er Gr.K",e2:"3e meilleur"},
  {id:88,date:"04/07",h:"19:00",t:"1/16",e1:"2e Gr.D",e2:"2e Gr.K"},
  {id:89,date:"06/07",h:"23:00",t:"1/8",e1:"V.M74",e2:"V.M77"},
  {id:90,date:"07/07",h:"19:00",t:"1/8",e1:"V.M73",e2:"V.M75"},

];
const ALL=[...MG,...MKO];const MEDALS=["🥇","🥈","🥉","4ᵉ"];

let votes={},results={},tab="matchs",filterPhase="Groupes",filterGroupe="Tous";
let me=localStorage.getItem("cdm26_me")||null;

function setSync(s){const d=document.getElementById("sync-dot"),t=document.getElementById("sync-txt");d.className="sync-dot"+(s==="off"?" off":s==="busy"?" busy":"");t.textContent=s==="off"?"hors ligne":s==="busy"?"sync…":"synchronisé";}
function showBanner(m){const b=document.getElementById("banner");if(m){b.textContent=m;b.classList.add("show");}else b.classList.remove("show");}

async function loadAll(){
  setSync("busy");
  try{
    const [pr,re]=await Promise.all([db.from("pronostics").select("*"),db.from("resultats").select("*")]);
    if(pr.error)throw pr.error;if(re.error)throw re.error;
    votes={};
    pr.data.forEach(row=>{const i=PARTICIPANTS.indexOf(row.participant);if(i<0)return;if(!votes[row.match_id])votes[row.match_id]=[null,null,null,null];votes[row.match_id][i]=row.choix;});
    results={};re.data.forEach(row=>{results[row.match_id]=row.resultat;});
    setSync("ok");showBanner(null);
  }catch(e){
    setSync("off");
    showBanner("Connexion à la base impossible — vérifie SUPABASE_URL / SUPABASE_KEY dans le code. Données non enregistrées tant que ce message s'affiche.");
    console.error(e);
  }
}

function computeScores(){const sc={};PARTICIPANTS.forEach(p=>sc[p]=0);ALL.forEach(m=>{const r=results[m.id];if(!r)return;const mv=votes[m.id]||[];const maj=getMajority(mv,sc);if(maj===r)PARTICIPANTS.forEach((p,i)=>{if(mv[i]===r)sc[p]=(sc[p]||0)+1;});});return sc;}
function getMajority(mv,sc){const c={};mv.forEach(v=>{if(v)c[v]=(c[v]||0)+1;});if(!Object.keys(c).length)return null;const mx=Math.max(...Object.values(c));const w=Object.keys(c).filter(k=>c[k]===mx);if(w.length===1)return w[0];let best=-1,bc=w[0];w.forEach(x=>PARTICIPANTS.forEach((p,i)=>{if(mv[i]===x&&(sc[p]||0)>best){best=sc[p]||0;bc=x;}}));return bc;}

function render(){renderWho();const sc=computeScores();renderBoard(sc);renderContent(sc);}
function renderWho(){document.getElementById("who").innerHTML=PARTICIPANTS.map(p=>`<button class="who-btn ${me===p?'on':''}" onclick="setMe('${p}')">${p}</button>`).join('');}
function renderBoard(sc){const sorted=[...PARTICIPANTS].sort((a,b)=>(sc[b]||0)-(sc[a]||0));const total=Object.values(results).filter(Boolean).length;document.getElementById("board").innerHTML=sorted.map((p,i)=>`<div class="board-cell ${i===0&&(sc[p]||0)>0?'lead':''}"><div class="b-rank">${MEDALS[i]}</div><div class="b-name">${p}</div><div class="b-score">${sc[p]||0}</div><div class="b-pct">${total>0?Math.round(((sc[p]||0)/total)*100)+'%':'—'}</div></div>`).join('');}
function renderContent(sc){document.getElementById("content").innerHTML=tab==="matchs"?renderMatchs(sc):tab==="classement"?renderClassement(sc):renderStats(sc);}
function renderMatchs(sc){const phases=["Groupes","1/16","1/8","Quart","Demi","FINALE"];let matches=filterPhase==="Groupes"?(filterGroupe==="Tous"?MG:filterGroupe==="France"?MG.filter(m=>m.fr):MG.filter(m=>m.g===filterGroupe)):MKO.filter(m=>m.t===filterPhase);const groups=["Tous","France",...[...new Set(MG.map(m=>m.g))].sort()];return `<div class="scroller">${phases.map(p=>`<button class="chip ${filterPhase===p?'on':''}" onclick="setPhase('${p}')">${p==="Groupes"?"Phase de groupes":p==="FINALE"?"Finale":p}</button>`).join('')}</div>${filterPhase==="Groupes"?`<div class="scroller sub">${groups.map(g=>`<button class="chip ${filterGroupe===g?'on':''}" onclick="setGroupe('${g}')">${g==="Tous"?"Tous":g==="France"?"France":"Gr. "+g}</button>`).join('')}</div>`:''}<div class="slabel"><span class="slabel-text">${filterPhase==="Groupes"?(filterGroupe==="Tous"?"Tous les matchs":filterGroupe==="France"?"La France":"Groupe "+filterGroupe):filterPhase}</span><span class="slabel-line"></span><span class="slabel-count">${matches.length} matchs</span></div>${matches.map(m=>matchCard(m,sc)).join('')}`;}
function matchCard(m,sc){const mv=votes[m.id]||[null,null,null,null];const maj=getMajority(mv,sc),real=results[m.id];const s1=m.e1.split(' ')[0],s2=m.e2.split(' ')[0];const majL=maj?(maj==="1"?m.e1:maj==="2"?m.e2:"Match nul"):null;
const rows=PARTICIPANTS.map((p,i)=>{const isMe=me===p;const dis=isMe?"":"disabled";const lk=isMe?"":"locked";return `<div class="vrow"><span class="vname ${isMe?'me':''}">${p}</span><div class="vopts"><button class="vbtn ${lk} ${mv[i]==='1'?'on':''}" ${dis} onclick="vote(${m.id},${i},'1')">${s1}</button><button class="vbtn ${lk} ${mv[i]==='N'?'on':''}" ${dis} onclick="vote(${m.id},${i},'N')">Nul</button><button class="vbtn ${lk} ${mv[i]==='2'?'on':''}" ${dis} onclick="vote(${m.id},${i},'2')">${s2}</button></div></div>`;}).join('');
const badges=real?PARTICIPANTS.map((p,i)=>mv[i]?`<span class="badge ${mv[i]===real?'ok':'ko'}">${mv[i]===real?'✓':'✗'} ${p}</span>`:'').join(''):'';const tag=m.g?`<span class="c-tag">Groupe ${m.g}</span>`:`<span class="c-tag">${m.t}</span>`;return `<div class="card ${m.fr?'fr':''}"><div class="card-top"><span class="c-num">M${String(m.id).padStart(2,'0')}</span><span class="c-when">${m.date} · ${m.h}</span>${m.fr?`<span class="c-tag frtag">France</span>`:''}${tag}</div><div class="teams"><div class="team"><span class="flag">${f(m.e1)}</span><span class="tname">${m.e1}</span></div><div class="vs">VS</div><div class="team r"><span class="tname">${m.e2}</span><span class="flag">${f(m.e2)}</span></div></div><div class="votes">${rows}<div class="retenu"><span class="rlabel">Retenu</span>${majL?`<span class="rval">${majL}</span>`:'<span class="rpending">en attente</span>'}<select class="rsel" onchange="setResult(${m.id},this.value)"><option value="" ${!real?'selected':''}>Résultat ?</option><option value="1" ${real==='1'?'selected':''}>${s1}</option><option value="N" ${real==='N'?'selected':''}>Nul</option><option value="2" ${real==='2'?'selected':''}>${s2}</option></select>${real&&badges?`<div class="badges">${badges}</div>`:''}</div></div></div>`;}
function renderClassement(sc){const sorted=[...PARTICIPANTS].sort((a,b)=>(sc[b]||0)-(sc[a]||0));const total=Object.values(results).filter(Boolean).length;const max=Math.max(...Object.values(sc),1);const last=sorted[sorted.length-1];return `<div class="slabel"><span class="slabel-text">Classement</span><span class="slabel-line"></span><span class="slabel-count">${total} joués</span></div>${sorted.map((p,i)=>`<div class="rcard ${i===0&&(sc[p]||0)>0?'gold':''}"><div class="rtop"><span class="rmedal ${i===3?'txt':''}">${MEDALS[i]}</span><span class="rname">${p}</span><span class="rscore">${sc[p]||0}<span class="runit">pts</span></span></div><div class="rbars"><div class="brow"><span class="blabel">Bons pronos</span><div class="btrack"><div class="bfill" style="width:${max>0?((sc[p]||0)/max*100):0}%"></div></div><span class="bval">${sc[p]||0}/${total}</span></div><div class="brow"><span class="blabel">Réussite</span><div class="btrack"><div class="bfill neutral" style="width:${total>0?((sc[p]||0)/total*100):0}%"></div></div><span class="bval">${total>0?Math.round(((sc[p]||0)/total)*100)+'%':'—'}</span></div></div></div>`).join('')}${total>0?`<div class="apero"><span class="apero-ico">🍻</span><div class="apero-txt"><b>Clause Apéro —</b> à ce stade, <span class="apero-name">${last}</span> offre l'apéro à la fin du tournoi.</div></div>`:''}`;}
function renderStats(sc){const total=Object.values(results).filter(Boolean).length;const max=Math.max(...Object.values(sc),0);const sorted=[...PARTICIPANTS].sort((a,b)=>(sc[b]||0)-(sc[a]||0));const detail=PARTICIPANTS.map((p,pi)=>{const voted=ALL.filter(m=>results[m.id]&&(votes[m.id]||[])[pi]).length;const correct=ALL.filter(m=>{const r=results[m.id];return r&&(votes[m.id]||[])[pi]===r;}).length;const missed=ALL.filter(m=>results[m.id]&&!(votes[m.id]||[])[pi]).length;return `<div class="rcard"><div class="rtop"><span class="rname">${p}</span><span class="rscore" style="font-size:24px">${sc[p]||0}<span class="runit">pts</span></span></div><div class="rbars"><div class="brow"><span class="blabel">Saisis</span><div class="btrack"><div class="bfill neutral" style="width:${total>0?(voted/total*100):0}%"></div></div><span class="bval">${voted}/${total}</span></div><div class="brow"><span class="blabel">Corrects</span><div class="btrack"><div class="bfill" style="width:${voted>0?(correct/voted*100):0}%"></div></div><span class="bval">${correct}</span></div><div class="brow"><span class="blabel">Manqués</span><div class="btrack"><div class="bfill neutral" style="width:${total>0?(missed/total*100):0}%"></div></div><span class="bval">${missed}</span></div></div></div>`;}).join('');const rules=[["⚽","Mise","1 € par personne et par match — 4 € collectifs"],["🗳️","Vote majoritaire","Le pronostic le plus choisi est retenu avant chaque match"],["⚖️","Égalité","En cas d'ex-æquo, le meilleur taux de réussite tranche"],["💰","Gains","Répartis équitablement entre les quatre participants"],["🍻","Apéro","Le dernier du classement offre l'apéro à Niort"]].map(([i,t,d])=>`<div class="rule"><span class="rule-ico">${i}</span><div><div class="rule-t">${t}</div><div class="rule-d">${d}</div></div></div>`).join('');return `<div class="slabel"><span class="slabel-text">Vue d'ensemble</span><span class="slabel-line"></span></div><div class="grid"><div class="scard"><div class="slbl">Matchs joués</div><div class="sval a">${total}</div><div class="ssub">sur 104 au total</div></div><div class="scard"><div class="slbl">Mise engagée</div><div class="sval">${total*4} €</div><div class="ssub">1 € × 4 × ${total}</div></div><div class="scard"><div class="slbl">En tête</div><div class="sval">${max}</div><div class="ssub">${sorted[0]}</div></div><div class="scard"><div class="slbl">Restants</div><div class="sval">${104-total}</div><div class="ssub">${(104-total)*4} € à jouer</div></div></div><div class="slabel"><span class="slabel-text">Par joueur</span><span class="slabel-line"></span></div>${detail}<div class="slabel"><span class="slabel-text">Règles</span><span class="slabel-line"></span></div>${rules}<div style="height:16px"></div>`;}

window.setMe=function(p){me=(me===p?null:p);if(me)localStorage.setItem("cdm26_me",me);else localStorage.removeItem("cdm26_me");render();};
window.vote=async function(id,pi,v){
  if(me!==PARTICIPANTS[pi])return;
  const cur=votes[id]?[...votes[id]]:[null,null,null,null];
  const newv=cur[pi]===v?null:v;cur[pi]=newv;votes[id]=cur;render();
  setSync("busy");
  try{
    if(newv===null){const {error}=await db.from("pronostics").delete().match({match_id:id,participant:PARTICIPANTS[pi]});if(error)throw error;}
    else{const {error}=await db.from("pronostics").upsert({match_id:id,participant:PARTICIPANTS[pi],choix:newv});if(error)throw error;}
    setSync("ok");showBanner(null);
  }catch(e){setSync("off");showBanner("Échec de l'enregistrement — base injoignable.");console.error(e);}
};
window.setResult=async function(id,v){
  results[id]=v||null;render();setSync("busy");
  try{
    if(!v){const {error}=await db.from("resultats").delete().match({match_id:id});if(error)throw error;}
    else{const {error}=await db.from("resultats").upsert({match_id:id,resultat:v});if(error)throw error;}
    setSync("ok");showBanner(null);
  }catch(e){setSync("off");showBanner("Échec de l'enregistrement — base injoignable.");console.error(e);}
};
window.setTab=function(t){tab=t;document.querySelectorAll(".nbtn").forEach(b=>b.classList.remove("on"));document.getElementById("nav-"+t).classList.add("on");document.getElementById("content").scrollTop=0;render();};
window.setPhase=function(p){filterPhase=p;render();};
window.setGroupe=function(g){filterGroupe=g;render();};

async function refresh(){await loadAll();render();}
refresh();
setInterval(refresh,15000);
