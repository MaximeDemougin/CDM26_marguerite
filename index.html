<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronostics CDM 2026</title>
<link rel="icon" href="2026_FIFA_World_Cup.svg.png" type="image/png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:wght@700;800;900&family=Fredoka:wght@500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#eef4fb;--card:#ffffff;--ink:#0f1d31;--dim:#314a67;--faint:#5f7694;
  --line:#b9cce1;--line2:#9eb6cf;--accent:#D7282F;--accent-soft:#fcdcdd;
  --accent-fixed:#D7282F;--accent-soft-fixed:#fcdcdd;
  --lock:#14916b;--lock-soft:#e2f8f0;--lock-deep:#0c6b4e;
  --bet-warn:#FF5A1E;--bet-warn-soft:#ffe9df;--bet-warn-deep:#9c3a12;
  --bet-on:#14916b;--bet-on-soft:#e2f8f0;--bet-on-deep:#0c6b4e;
  --fr:#2d5ce6;--ok:#14916b;--ko:#D7282F;
  --bg1:rgba(45,92,230,.20);--bg2:rgba(215,40,47,.22);--bg3:rgba(164,210,51,.14);--bg4:#e7eff9;
  --wc-purple:#5B2D8C;--wc-red:#D7282F;--wc-orange:#FF5A1E;--wc-lime:#A4D233;
  --wc-blue:#2D5CE6;--wc-lav:#B79CE4;--wc-salmon:#F8A29A;--wc-mint:#63E0BE;
  --wc-yellow:#F5E642;--wc-magenta:#E4007C;--wc-teal:#007A5E;--wc-black:#101418;
  --font-round:'Fredoka','Manrope',sans-serif;
  --font-cond:'Barlow Condensed','Manrope',sans-serif;
}
body{font-family:'Manrope',sans-serif;background:radial-gradient(circle at 10% -10%,rgba(13,79,194,.16),transparent 32%),radial-gradient(circle at 92% -8%,rgba(215,24,58,.14),transparent 34%),linear-gradient(180deg,#f7fafe 0%,#eaf2fb 100%);color:var(--ink);min-height:100vh;font-feature-settings:"tnum"}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
html::before,html::after{content:"";position:fixed;top:0;height:200vh;width:clamp(40px,12vw,220px);pointer-events:none;z-index:0;background-image:radial-gradient(circle 3px,color-mix(in oklab,var(--fr) 55%,transparent) 100%,transparent 100%),radial-gradient(circle 2.5px,color-mix(in oklab,var(--accent) 50%,transparent) 100%,transparent 100%),radial-gradient(circle 2px,color-mix(in oklab,var(--fr) 38%,transparent) 100%,transparent 100%);background-size:120px 230px,90px 190px,70px 150px;background-position:14px 40px,50px 120px,30px 80px;will-change:transform;animation:confettiFall 24s linear infinite}
html::before{left:0;mask-image:linear-gradient(90deg,black 30%,transparent 100%);-webkit-mask-image:linear-gradient(90deg,black 30%,transparent 100%)}
html::after{right:0;animation-delay:-12s;mask-image:linear-gradient(270deg,black 30%,transparent 100%);-webkit-mask-image:linear-gradient(270deg,black 30%,transparent 100%)}
@keyframes confettiFall{from{transform:translateY(-100vh)}to{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){html::before,html::after{animation:none}}
::-webkit-scrollbar{width:0;height:0}
.app{width:100%;max-width:min(100%,1180px);margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#fdfefe;position:relative;border:1px solid color-mix(in oklab,var(--line2) 78%, #7f9fbe);border-radius:20px;overflow:hidden;box-shadow:0 12px 30px rgba(15,29,49,.10);z-index:1}
.app.wide{max-width:min(100%,1800px)}
.header{padding:18px 22px 14px;border-bottom:1px solid color-mix(in oklab,var(--line2) 86%, #8aa5c2);position:sticky;top:0;z-index:100;background:rgba(249,252,255,.95);backdrop-filter:blur(8px) saturate(130%)}
.h-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.h-brand{display:flex;align-items:center;gap:14px}
.cdm-logo{height:64px;width:auto;object-fit:contain;flex-shrink:0}
.eyebrow{font-size:9px;letter-spacing:2.2px;color:var(--wc-purple);text-transform:uppercase;font-weight:800;margin-bottom:6px}
.title{font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;letter-spacing:-.5px;line-height:1;color:#0b1930}
.subtitle{font-size:12px;color:var(--dim);margin-top:6px;font-weight:500}
.who{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.who-tools{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.who-btn{padding:6px 14px;border:1px solid color-mix(in oklab,var(--pv, var(--line2)) 56%, var(--line2));border-radius:0 8px 0 8px;background:color-mix(in oklab,var(--pv-soft, #eaf1fb) 86%, #d9e6f6);color:color-mix(in oklab,var(--pv, var(--dim)) 70%, #1c334f);font-family:var(--font-cond);font-size:14px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .16s}
.who-btn:hover{border-color:color-mix(in oklab,var(--pv, var(--ink)) 70%, var(--line2));color:color-mix(in oklab,var(--pv, var(--ink)) 86%, #12243b);transform:translateY(-1px)}
.who-btn.on{background:var(--pv,var(--accent));border-color:var(--pv,var(--accent));color:#fff;font-weight:800;box-shadow:0 6px 16px color-mix(in oklab,var(--pv,var(--accent)) 42%,transparent),inset 0 1px 0 rgba(255,255,255,.22)}
.who-menu{position:relative}
.who-menu summary{list-style:none}
.who-menu summary::-webkit-details-marker{display:none}
.who-menu-btn{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border:1px solid color-mix(in oklab,var(--line2) 86%, white);border-radius:0 8px 0 8px;background:linear-gradient(180deg,#ffffff 0%,#f4f8fd 100%);color:var(--dim);font-family:var(--font-cond);font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;user-select:none;transition:all .15s;box-shadow:0 8px 18px rgba(15,29,49,.08)}
.who-menu-btn:hover,.who-menu[open] .who-menu-btn{border-color:color-mix(in oklab,var(--ink) 40%, var(--line2));color:var(--ink);transform:translateY(-1px);box-shadow:0 12px 24px rgba(15,29,49,.14)}
.who-menu-dot{width:10px;height:10px;border-radius:999px;box-shadow:0 0 0 2px rgba(15,29,49,.08) inset;flex-shrink:0}
.who-menu-pop{position:absolute;top:calc(100% + 8px);left:0;min-width:210px;padding:10px;border:2px solid var(--line2);border-radius:14px;background:rgba(255,255,255,.98);box-shadow:0 18px 40px rgba(15,29,49,.14);backdrop-filter:blur(12px);display:grid;gap:8px;z-index:30}
.who-color-label{font-size:11px;font-weight:700;color:var(--dim);padding:0 2px}
.who-swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:2px 0}
.who-swatch{width:36px;height:36px;border-radius:999px;border:3px solid transparent;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 6px rgba(15,29,49,.18);outline:none}
.who-swatch:hover{transform:scale(1.14);box-shadow:0 4px 14px rgba(15,29,49,.28)}
.who-swatch.on{border-color:white;box-shadow:0 0 0 3.5px var(--ink),0 4px 14px rgba(15,29,49,.32);transform:scale(1.1)}
.who-reset{padding:6px 10px;border:1px solid color-mix(in oklab,var(--line2) 86%, white);border-radius:0 8px 0 8px;background:linear-gradient(180deg,#ffffff 0%,#f3f7fc 100%);color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;box-shadow:0 6px 14px rgba(15,29,49,.07)}
.who-reset:hover{border-color:color-mix(in oklab,var(--ink) 40%, var(--line2));color:var(--ink);transform:translateY(-1px)}
.sync{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--dim);font-weight:600;white-space:nowrap}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);transition:background .3s}
.sync-dot.off{background:var(--ko)}
.sync-dot.busy{background:#7f96b3;animation:bl .8s infinite}
@keyframes bl{50%{opacity:.3}}
.board{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:2px solid var(--line2)}
.board-cell{padding:15px 8px 14px;text-align:center;border-right:2px solid var(--line);position:relative}
.board-cell:last-child{border-right:none}
.board-cell.lead::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--accent)}
.b-rank{font-size:10px;color:var(--faint);font-weight:600;margin-bottom:4px}
.b-name{font-size:11px;font-weight:600;color:var(--dim);margin-bottom:6px}
.board-cell.lead .b-name{color:var(--accent)}
.b-score{font-size:26px;font-weight:700;line-height:1;color:var(--ink);letter-spacing:-.5px}
.board-cell.lead .b-score{color:var(--accent)}
.b-pct{font-size:10px;color:var(--faint);margin-top:5px;font-weight:500}
.content{flex:1;overflow-y:auto;padding-bottom:78px}
.page-head{padding:16px 20px 8px;border-bottom:2px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.68),rgba(255,255,255,0))}
.page-head-title{font-size:18px;font-weight:700;letter-spacing:-.3px;color:var(--ink)}
.page-head-sub{margin-top:4px;font-size:12px;color:var(--dim)}
.scroller{display:flex;gap:7px;padding:16px 20px 4px;overflow-x:auto;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.chip{padding:7px 15px;border:1px solid #9cb6d3;border-radius:0 8px 0 8px;background:linear-gradient(135deg,#e3ecf9 0%,#d3e3f8 100%);background-size:180% 180%;color:#1f3654;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .16s;font-family:inherit;box-shadow:0 4px 10px rgba(15,79,194,.12)}
.chip:hover{border-color:#4d7fb8;color:#0f2747;transform:translateY(-2px) scale(1.01);animation:chipPulse .75s ease-out;box-shadow:0 8px 18px rgba(13,79,194,.24)}
.chip.on{background:var(--wc-black);border-color:var(--wc-black);color:#fff;box-shadow:0 8px 18px rgba(16,20,24,.30)}
.scroller.sub .chip{padding:5px 12px;font-size:10px}
@keyframes chipPulse{0%{background-position:0% 50%}100%{background-position:100% 50%}}
.slabel{display:flex;align-items:center;gap:11px;padding:18px 20px 10px}
.slabel-text{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.slabel-line{flex:1;height:1px;background:color-mix(in oklab,var(--line2) 58%, transparent)}
.slabel-count{font-size:10px;color:var(--faint);font-weight:600}
/* En-tête de journée (collapsible) */
.day{display:flex;align-items:center;gap:11px;width:calc(100% - 36px);margin:12px 18px 3px;padding:10px 14px;border:none;background:#fff;border-radius:10px;cursor:pointer;font-family:inherit;box-shadow:0 10px 22px rgba(19,41,66,.12),0 0 0 1px rgba(255,255,255,.74) inset}
.day:hover{border-color:var(--ink)}
.day.open{border-radius:10px 10px 0 0;margin-bottom:0;box-shadow:0 10px 22px rgba(19,41,66,.12),0 0 0 1px rgba(255,255,255,.74) inset}
.day-chev{font-size:11px;color:var(--faint);transition:transform .2s;flex-shrink:0}
.day.open .day-chev{transform:rotate(90deg)}
.day-name{font-size:12px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.day-meta{margin-left:auto;display:flex;align-items:center;gap:8px}
.day-prog{font-size:10px;color:var(--faint);font-weight:600}
.day-pill{font-size:10px;color:var(--dim);font-weight:600;background:var(--paper);border:1px solid var(--line2);padding:2px 8px;border-radius:20px}
.day.finished{opacity:.62}
.day.finished:hover{opacity:1}
.day-prog.done{color:var(--accent)}
.datebar{display:flex;align-items:center;gap:9px;padding:12px 20px 2px}
.datebar-lbl{font-size:11px;font-weight:600;color:var(--dim);white-space:nowrap}
.datesel{flex:1;background:#ffffff;border:none;color:var(--ink);font-size:12px;font-weight:500;padding:10px 12px;cursor:pointer;font-family:inherit;border-radius:10px;box-shadow:0 8px 18px rgba(19,41,66,.10),0 0 0 1px rgba(255,255,255,.7) inset}
.datesel:focus{outline:none;box-shadow:0 0 0 2px color-mix(in oklab,var(--fr) 26%, transparent),0 8px 18px rgba(19,41,66,.10)}
.filterbar{display:grid;grid-template-columns:1.1fr .9fr;gap:9px;padding:10px 20px 2px}
.searchbox,.teamsel{width:100%;background:#ffffff;border:none;color:var(--ink);font-size:12px;font-weight:500;padding:10px 12px;font-family:inherit;border-radius:10px;box-shadow:0 8px 18px rgba(19,41,66,.10),0 0 0 1px rgba(255,255,255,.7) inset}
.searchbox::placeholder{color:var(--faint)}
.searchbox:focus,.teamsel:focus{outline:none;box-shadow:0 0 0 2px color-mix(in oklab,var(--fr) 26%, transparent),0 8px 18px rgba(19,41,66,.10)}
.datereset{background:#ffffff;border:none;color:var(--dim);font-size:12px;font-weight:600;padding:10px 12px;cursor:pointer;font-family:inherit;border-radius:0 10px 0 10px;flex-shrink:0;transition:all .15s;box-shadow:0 8px 18px rgba(19,41,66,.10),0 0 0 1px rgba(255,255,255,.7) inset}
.datereset:hover{color:var(--ink);transform:translateY(-1px);box-shadow:0 12px 22px rgba(19,41,66,.14),0 0 0 1px rgba(255,255,255,.75) inset}
.day-body{overflow:hidden;margin:0 18px 12px;padding:10px;border:none;border-radius:0 0 10px 10px;background:#fdfefe;box-shadow:0 12px 24px rgba(19,41,66,.12),0 0 0 1px rgba(255,255,255,.72) inset}
.day-body .card{margin:0 0 10px}
.day-body .card:last-child{margin-bottom:0}
.card{--ctrl-h:34px;--vote-h:30px;--ctrl-radius:8px;--ctrl-fs:11px;margin:0 18px 16px;border:none;background:linear-gradient(170deg,#1e2d4e 0%,#141e34 100%);border-radius:18px;overflow:hidden;transition:transform .18s;box-shadow:0 12px 32px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.08) inset;position:relative}
.card:hover{transform:translateY(-1px)}
.card.filled{border-color:color-mix(in oklab,var(--ok) 28%, var(--line2))}
.card.locked{border-color:color-mix(in oklab,var(--line2) 68%, #9fb0c4)}
.card.locked .votes{border-top-color:rgba(255,255,255,.06)}
.card.bet-pending{background:linear-gradient(170deg,#1e2d4e 0%,#141e34 100%);background-size:100% 100%;animation:livePulse 2.4s ease-in-out infinite;position:relative;box-shadow:0 12px 32px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.08) inset}
.card.bet-pending .votes{border-top-color:color-mix(in oklab,var(--bet-warn) 24%, var(--line))}
.card.bet-pending:hover{transform:translateY(-1px)}
.card.bet-won{background:linear-gradient(170deg,#1e2d4e 0%,#141e34 100%);box-shadow:0 12px 32px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.08) inset}
.card.bet-won .votes{border-top-color:rgba(164,210,51,.22)}
.card.bet-won:hover{transform:translateY(-1px)}
.card.bet-lost{background:linear-gradient(170deg,#1e2d4e 0%,#141e34 100%);box-shadow:0 12px 32px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.08) inset}
.card.bet-lost .votes{border-top-color:rgba(215,40,47,.22)}
.card.bet-lost:hover{transform:translateY(-1px)}
.card.fr{background:linear-gradient(170deg,#1e2d4e 0%,#141e34 100%);box-shadow:0 12px 32px rgba(0,0,0,.42),0 0 0 1.5px rgba(255,255,255,.12) inset}
.card::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--wc-purple) 0% 12%,var(--wc-mint) 12% 28%,var(--wc-red) 28% 44%,var(--wc-lime) 44% 68%,var(--wc-blue) 68% 83%,var(--wc-orange) 83% 100%);z-index:2;pointer-events:none}
.card.bet-pending::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--wc-orange);pointer-events:none;animation:pendingBottomSolid 1.25s ease-in-out infinite;z-index:3}
.card.bet-won::after{background:var(--wc-lime);animation:none;z-index:3}
.card.bet-lost::after{background:var(--wc-red);animation:none;z-index:3}
@keyframes liveBorderShift{0%{background-position:0 0,0% 50%}100%{background-position:0 0,100% 50%}}
@keyframes livePulse{0%,100%{box-shadow:0 12px 32px rgba(0,0,0,.42),0 0 0 1px rgba(255,90,30,.18) inset}50%{box-shadow:0 14px 36px rgba(0,0,0,.52),0 0 0 1.5px rgba(255,90,30,.38) inset}}
@keyframes pendingBottomSolid{0%,100%{opacity:.68}50%{opacity:1}}
@keyframes pendingBadgeBreath{0%,100%{transform:scale(1);opacity:.92;box-shadow:0 2px 8px color-mix(in oklab,var(--bet-warn) 18%, transparent)}50%{transform:scale(1.045);opacity:1;box-shadow:0 5px 14px color-mix(in oklab,var(--bet-warn) 30%, transparent)}}
/* Carte repliée : ligne compacte cliquable */
.teams-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 14px;box-shadow:inset 0 -1px 0 rgba(255,255,255,.10)}
.c-top-left{display:inline-flex;align-items:center;gap:10px;justify-self:start;min-width:0}
.card-chev{font-size:10px;color:var(--faint);transition:transform .2s;margin-left:2px}
.card:not(.collapsed) .card-chev{transform:rotate(90deg)}
.mini-status{margin-left:auto;display:flex;align-items:center;gap:7px}
.mini-pron{font-size:11px;font-weight:600;color:var(--accent)}
.mini-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mini-dot.done{background:var(--accent)}
.mini-dot.partial{background:#7f96b3}
.mini-dot.empty{background:var(--line2)}
.collapsible{overflow:hidden;transition:none}
.c-num{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 10px;border-radius:999px;font-size:11px;color:#fff;font-weight:900;letter-spacing:.5px;background:var(--wc-blue);font-family:var(--font-cond)}
.c-when{font-family:var(--font-cond);font-size:14px;color:#fff;font-weight:800;letter-spacing:.5px}
.c-state{font-family:var(--font-cond);font-size:11px;font-weight:800;letter-spacing:1px;padding:4px 10px;border-radius:999px;text-transform:uppercase;margin:0;border:1px solid color-mix(in oklab,var(--line2) 92%, #8ea9c7);background:#f0f5fc;color:var(--dim);white-space:nowrap;justify-self:center}
.c-state.pending{border-color:color-mix(in oklab,var(--bet-warn) 54%, var(--line2));background:var(--bet-warn-soft);color:var(--bet-warn-deep);animation:pendingBadgeBreath 2.6s ease-in-out infinite;box-shadow:none}
.c-state.won{border-color:color-mix(in oklab,var(--bet-on) 62%, var(--line2));background:var(--bet-on-soft);color:var(--bet-on-deep)}
.c-state.lost{border-color:color-mix(in oklab,var(--ko) 48%, var(--line2));background:color-mix(in oklab,var(--ko) 9%, white);color:var(--ko)}
.c-tag{margin-left:auto;font-family:var(--font-cond);font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 10px;background:transparent;border:none;box-shadow:inset 0 0 0 1.5px var(--wc-lime);color:var(--wc-lime);border-radius:999px;text-transform:uppercase}
.c-tag.frtag{background:#fff;box-shadow:none;color:var(--wc-black)}
.c-top-tags{margin-left:0;display:inline-flex;align-items:center;gap:5px;justify-self:end}
.c-top-tags .c-tag{margin-left:0}

.card.bet-pending .teams-head{box-shadow:inset 0 -3px 0 var(--wc-orange)}
.card.bet-won .teams-head{box-shadow:inset 0 -3px 0 var(--wc-lime)}
.card.bet-lost .teams-head{box-shadow:inset 0 -3px 0 var(--wc-red)}
.card.bet-pending .c-state.pending{border-color:rgba(255,90,30,.55);background:rgba(255,90,30,.16);color:#ffb38f}
.card.bet-won .c-state.won{border-color:rgba(164,210,51,.6);background:rgba(164,210,51,.16);color:#d4ee92}
.card.bet-lost .c-state.lost{border-color:rgba(215,40,47,.6);background:rgba(215,40,47,.18);color:#ffaab0}
.teams{display:flex;flex-direction:column;margin:8px 8px 0;border-radius:14px;position:relative;background:#0d1525;overflow:hidden;box-shadow:inset 3px 0 0 var(--wc-red),inset -3px 0 0 var(--wc-purple)}
.teams-score{display:flex;align-items:center;padding:14px 16px}
.teams::before,.teams::after{content:"";position:absolute;left:0;right:0;height:3px;z-index:1}
.teams::before{top:0;background:linear-gradient(90deg,var(--wc-red) 0% 7%,var(--wc-blue) 7% 38%,var(--wc-mint) 38% 43%,var(--wc-lime) 43% 74%,var(--wc-orange) 74% 87%,var(--wc-purple) 87% 100%)}
.teams::after{bottom:0;background:linear-gradient(90deg,var(--wc-purple) 0% 10%,var(--wc-lime) 10% 38%,var(--wc-orange) 38% 50%,var(--wc-red) 50% 58%,var(--wc-blue) 58% 88%,var(--wc-mint) 88% 100%)}
.team{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.team.r{flex-direction:row-reverse;text-align:right}
.flag,.flag-sm{display:inline-block;position:relative;overflow:hidden;flex-shrink:0;vertical-align:middle}
.flag{width:38px;height:26px;border-radius:0 6px 0 6px;box-shadow:0 0 0 2px rgba(255,255,255,.88),0 2px 10px rgba(0,0,0,.4)}
.flag-sm{width:20px;height:14px;border-radius:0 4px 0 4px;box-shadow:0 0 0 1.5px rgba(255,255,255,.8)}
.flag img,.flag-sm img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1.32);width:100%;height:100%;object-fit:cover}
.with-flag{display:inline-flex;align-items:center;gap:4px}
.tname{font-family:var(--font-cond);font-size:18px;font-weight:900;line-height:1;color:#fff;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{font-family:var(--font-cond);font-size:13px;color:#0d332a;background:#63e0be;padding:6px 14px;border-radius:0 8px 0 8px;font-weight:900;letter-spacing:2px;text-transform:uppercase;flex-shrink:0;margin:0 10px;box-shadow:none}
.vs.scored{font-size:22px;letter-spacing:4px;padding:8px 18px}
.votes{padding:6px 12px 12px;background:linear-gradient(180deg,#f0f5ff 0%,#eaf0fd 100%);border-top:1px solid rgba(30,45,140,.12)}
.votes-title{display:flex;align-items:center;gap:8px;font-family:var(--font-cond);font-size:12px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:var(--dim);margin:2px 0 6px;padding-left:1px}
.vlock{display:inline-flex;align-items:center;gap:4px;font-size:8px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:999px;background:rgba(255,160,60,.14);color:#f4a86a;box-shadow:inset 0 0 0 1px rgba(255,160,60,.28)}
.vrow{display:grid;grid-template-columns:118px minmax(0,1fr) 118px;align-items:center;column-gap:10px;padding:4px 0;border-radius:10px;position:relative}
.vrow.me-row{background:color-mix(in oklab,var(--pv,var(--fr)) 10%,rgba(255,255,255,.5));margin:2px -8px;padding:6px 8px}
.vrow.me-row::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:999px;background:var(--pv, var(--accent));opacity:.9;z-index:0}
.vrow.can-edit .vopts{background:color-mix(in oklab,var(--pv,var(--fr)) 8%,rgba(255,255,255,.7));border-color:color-mix(in oklab,var(--pv,var(--fr)) 40%,transparent);box-shadow:none}
.vyou{display:inline-flex;align-items:center;font-size:7px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:var(--pv,var(--fr));color:#fff;flex-shrink:0}
.vrow>*{position:relative;z-index:1}
.vname{font-family:var(--font-cond);font-size:14px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;width:auto;color:var(--ink);display:flex;align-items:center;gap:7px;min-width:0}
.vname .vname-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vname.me{color:var(--ink);font-weight:900;letter-spacing:.4px}
.vavatar{width:28px;height:28px;border-radius:0 7px 0 7px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;letter-spacing:.3px;text-transform:uppercase;background:color-mix(in oklab,var(--pv,var(--fr)) 72%,#1a2d55);color:#fff;box-shadow:0 2px 8px color-mix(in oklab,var(--pv,var(--fr)) 38%,transparent)}
.vname.me .vavatar{background:var(--pv,var(--fr));box-shadow:0 3px 12px color-mix(in oklab,var(--pv,var(--fr)) 52%,transparent)}
.vopts{display:flex;gap:6px;width:min(100%,560px);justify-self:center;border:none;background:transparent;padding:0;box-shadow:none}
.vbtn{flex:1;min-height:var(--vote-h);padding:0 7px;border:1px solid rgba(30,45,140,.20);border-radius:0 7px 0 7px;background:#fff;color:rgba(15,29,78,.52);font-family:var(--font-cond);font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:background .18s,color .18s,box-shadow .18s,border-color .18s;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 2px 6px rgba(30,45,140,.10)}
.vopts .vbtn:nth-child(2){flex:.62}
.vbtn:hover:not(:disabled):not(.on){background:#f0f5ff;border-color:rgba(30,45,140,.40);color:rgba(15,29,78,.85);box-shadow:0 2px 8px rgba(30,45,140,.16)}
.vrow .vbtn.on{background:color-mix(in oklab,var(--pv,var(--fr)) 18%,transparent);color:color-mix(in oklab,var(--pv,var(--fr)) 90%,#0d1525);box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--pv,var(--fr)) 55%,transparent);font-weight:800}
.vrow.me-row .vbtn.on:not(.result-ok):not(.result-ko){background:var(--pv,var(--fr));color:#0d1525;box-shadow:0 2px 12px color-mix(in oklab,var(--pv,var(--fr)) 45%,transparent)}
.vrow .vbtn.on.result-ok{background:color-mix(in oklab,var(--bet-on) 14%,transparent);color:color-mix(in oklab,var(--bet-on) 80%,#002210);box-shadow:inset 0 0 0 2px color-mix(in oklab,var(--bet-on) 50%,transparent)}
.vrow .vbtn.on.result-ko{background:color-mix(in oklab,var(--ko) 12%,transparent);color:color-mix(in oklab,var(--ko) 80%,#2a0005);box-shadow:inset 0 0 0 2px color-mix(in oklab,var(--ko) 45%,transparent)}
.vbtn:disabled{cursor:default}
.vrow .vbtn.betlocked{cursor:not-allowed}
.vrow .vbtn.betlocked.pending-off{color:rgba(15,29,49,.22)}
.card.locked .vopts{background:rgba(15,29,49,.03);border-color:rgba(15,29,49,.07)}
.retenu{display:flex;flex-direction:column;align-items:stretch;gap:14px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(15,29,49,.10)}
.retenu-main{display:flex;align-items:center;gap:14px;justify-content:center;min-width:0;flex-wrap:wrap}
.retenu-tools{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.retenu-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.retenu-row.scoreline{justify-content:center}
.rlabel{font-family:var(--font-cond);font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase}
.rval{min-height:var(--ctrl-h);font-family:var(--font-cond);font-size:var(--ctrl-fs);font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:color-mix(in oklab,var(--ok) 80%,#002210);background:color-mix(in oklab,var(--ok) 14%,transparent);padding:0 11px;border-radius:0 8px 0 8px;display:inline-flex;align-items:center;border:1px solid color-mix(in oklab,var(--ok) 45%,transparent)}
.rpending{font-size:var(--ctrl-fs);color:var(--dim);font-style:italic;min-height:var(--ctrl-h);display:inline-flex;align-items:center}
.retenu-main .rlabel{min-width:54px;text-align:right}
.retenu-main .rval,.retenu-main .rpending{min-width:132px;justify-content:center}
.tie-chooser{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tie-btn{min-height:var(--ctrl-h);border:1px solid rgba(15,29,49,.18);background:rgba(15,29,49,.05);color:var(--dim);font-family:var(--font-cond);font-size:var(--ctrl-fs);font-weight:800;letter-spacing:.5px;text-transform:uppercase;border-radius:0 9px 0 9px;padding:0 10px;cursor:pointer;transition:all .15s;box-shadow:none}
.tie-btn:hover{border-color:var(--ink);background:rgba(15,29,49,.10);color:var(--ink);transform:translateY(-1px)}
.tie-btn.on{border-color:var(--ok);background:color-mix(in oklab,var(--ok) 20%,transparent);color:#6edea8}
.rsel{margin-left:auto;background:rgba(15,29,49,.05);border:1px solid rgba(15,29,49,.16);color:var(--ink);font-size:11px;font-weight:500;padding:6px 9px;cursor:pointer;font-family:inherit;border-radius:0 6px 0 6px;box-shadow:none}
.rsel:focus{outline:none;border-color:var(--accent)}
.m-score{display:flex;align-items:center;gap:6px;min-height:var(--ctrl-h);min-width:132px;justify-content:center;border:1px solid rgba(30,45,140,.22);background:#fff;border-radius:var(--ctrl-radius);padding:3px 6px;color:var(--ink);box-shadow:0 2px 6px rgba(30,45,140,.10)}
.m-score.filled{border-color:#3a7a00;box-shadow:0 2px 8px rgba(164,210,51,.30)}
.m-score .score-in{width:42px;padding:4px 3px;font-size:var(--ctrl-fs);font-family:var(--font-cond);font-weight:800;text-align:center;height:28px;background:transparent;color:var(--ink);border:none}
.m-score .score-vs{font-size:10px;font-weight:800;color:rgba(30,45,140,.35);font-family:var(--font-cond)}
.odds-box{display:flex;align-items:center;min-height:var(--ctrl-h);min-width:132px;justify-content:center;border:none;background:transparent;padding:0;box-shadow:none}
.odds-in{width:100%;padding:0 11px;border:1px solid rgba(30,45,140,.22);border-radius:0 9px 0 9px;background:#fff;color:var(--ink);font-family:var(--font-cond);font-weight:900;font-size:15px;text-align:center;height:var(--ctrl-h);box-shadow:0 2px 6px rgba(30,45,140,.10);-moz-appearance:textfield;appearance:textfield}
.odds-in:focus{outline:none;border-color:var(--wc-blue);box-shadow:0 0 0 2px rgba(45,92,230,.18)}
.bet-toggle{min-height:var(--ctrl-h);min-width:132px;justify-content:center;border:1.5px solid rgba(255,90,30,.55);background:rgba(255,90,30,.16);color:#ff9860;font-family:var(--font-cond);font-size:var(--ctrl-fs);font-weight:800;letter-spacing:.6px;text-transform:uppercase;border-radius:0 9px 0 9px;padding:0 11px;cursor:pointer;transition:all .15s;box-shadow:none;display:inline-flex;align-items:center}
.bet-toggle:hover{border-color:var(--wc-orange);background:rgba(255,90,30,.26);color:#ffc08a;box-shadow:0 0 0 3px rgba(255,90,30,.15);transform:translateY(-1px)}
.bet-toggle.on{border-color:#6a9200;background:var(--wc-lime);color:#1e3400;box-shadow:0 2px 10px rgba(164,210,51,.40)}
.reset-toggle{min-height:var(--ctrl-h);min-width:132px;justify-content:center;border:1.5px solid rgba(215,40,47,.45);background:rgba(215,40,47,.14);color:#ff7a84;font-family:var(--font-cond);font-size:var(--ctrl-fs);font-weight:800;letter-spacing:.6px;text-transform:uppercase;border-radius:0 9px 0 9px;padding:0 11px;cursor:pointer;transition:all .15s;box-shadow:none;display:inline-flex;align-items:center}
.reset-toggle:hover{border-color:var(--wc-red);background:rgba(215,40,47,.26);color:#ffaab0;box-shadow:0 0 0 3px rgba(215,40,47,.15);transform:translateY(-1px)}
.gain-pill{min-height:var(--ctrl-h);min-width:132px;justify-content:center;font-family:var(--font-cond);font-size:var(--ctrl-fs);font-weight:800;letter-spacing:.5px;text-transform:uppercase;border-radius:0 9px 0 9px;padding:0 11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:rgba(255,255,255,.45);display:inline-flex;align-items:center}
.gain-pill.win{border-color:#3a7a00;background:var(--wc-lime);color:#1a3200;box-shadow:0 2px 10px rgba(164,210,51,.38)}
.gain-pill.loss{border-color:#8a0e17;background:var(--wc-red);color:#fff;box-shadow:0 2px 10px rgba(215,40,47,.35)}
.gain-pill.sim{opacity:.8}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%;opacity:.9;margin-top:2px}
.badge{font-family:var(--font-cond);font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:2px 7px;border-radius:20px}
.badge.ok{background:var(--wc-lime);color:#1a3200;box-shadow:0 1px 5px rgba(164,210,51,.35)}
.badge.ko{background:var(--wc-red);color:#fff;box-shadow:0 1px 5px rgba(215,40,47,.30)}
.bet-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px 18px 2px}
.bet-box{border:none;background:#ffffff;border-radius:12px;padding:13px 15px;box-shadow:0 10px 22px rgba(19,41,66,.12),0 0 0 1px rgba(255,255,255,.72) inset}
.bet-box .slbl{margin-bottom:6px}
.bet-box .sval{font-size:22px;line-height:1}
.bet-box .sval.neg{color:var(--ko)}
.bet-box .sval.pos{color:var(--ok)}
@media (max-width:1024px){
  .app{max-width:100%}
  .header{padding:16px 16px 13px}
  .h-row{gap:12px;align-items:flex-start}
  .sync{white-space:normal;justify-content:flex-end;text-align:right}
  .board{grid-template-columns:repeat(4,minmax(0,1fr))}
  .slabel{padding-left:18px;padding-right:18px}
  .day{width:auto;margin-left:18px;margin-right:18px}
  .card,.rcard,.rule,.admin-card,.ko-line,.stats-table-wrap,.apero,.bracket-wrap{margin-left:18px;margin-right:18px}
  .group-grid,.grid,.stats-hero,.stats-bars,.finance-grid,.bet-summary{padding-left:18px;padding-right:18px}
  .stats-hero,.stats-bars,.finance-grid{grid-template-columns:1fr}
  .hero-grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .hero-score{flex-wrap:wrap;align-items:flex-start}
}
@media (max-width:760px){
  .header{padding:15px 12px 12px}
  .h-row{flex-direction:column;align-items:flex-start}
  .sync{justify-content:flex-start;text-align:left}
  .bet-summary{grid-template-columns:1fr}
  .grid,.stats-hero,.stats-bars{grid-template-columns:1fr}
  .hero-grid{grid-template-columns:1fr}
  .hero-big{font-size:42px}
  .finance-grid{grid-template-columns:1fr}
  .curve-head,.stats-table-head{align-items:flex-start;flex-direction:column}
  .finance-row{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board-cell:nth-child(2){border-right:none}
  .board-cell:nth-child(-n+2){border-bottom:2px solid var(--line)}
  .content{padding-bottom:92px}
  .datebar{padding:12px 14px 2px;flex-wrap:wrap}
  .filterbar{grid-template-columns:1fr;padding:10px 14px 2px}
  .datesel{min-width:0;width:100%}
  .slabel{flex-wrap:wrap;align-items:center;padding:16px 14px 10px}
  .slabel-text{white-space:normal}
  .slabel-line{order:3;flex-basis:100%}
  .day{margin:12px 14px 4px;padding:10px 12px;flex-wrap:wrap}
  .day.open{margin-bottom:0}
  .day-body{margin:0 14px 10px;padding:8px}
  .day-meta{width:100%;margin-left:0;justify-content:space-between}
  .card,.rcard,.rule,.admin-card,.ko-line,.stats-table-wrap,.apero,.bracket-wrap{margin-left:14px;margin-right:14px}
  .group-grid,.grid,.stats-hero,.stats-bars,.finance-grid,.bet-summary{padding-left:14px;padding-right:14px}
  .teams-score{padding:11px 10px;gap:8px}
  .teams-head{padding:7px 10px}
  .team{min-width:0}
  .tname{font-size:13px}
  .vs{padding:5px 10px;margin:0 6px}
  .vrow{grid-template-columns:104px minmax(0,1fr) 104px}
  .vname{width:auto}
  .vopts{width:100%}
  .retenu{gap:10px}
  .bar-row{grid-template-columns:1fr;gap:6px}
  .bar-val{text-align:left}
  .score-row{flex-wrap:wrap}
  .score-team{min-width:calc(50% - 24px)}
  .score-row .score-in{width:calc(50% - 20px)}
  .group-grid{grid-template-columns:1fr}
  .grow{grid-template-columns:20px 1fr 24px 24px 24px 24px;padding:8px 12px;gap:6px}
  .bracket-wrap{padding:8px 12px 12px}
  .stats-table{min-width:640px}
  .retenu-main{justify-content:flex-start}
  .retenu-tools{justify-content:flex-start}
  .retenu-row.scoreline{justify-content:flex-start}
  .page-head{padding:14px 14px 8px}
  .page-head-title{font-size:17px}
  .page-head-sub{font-size:11px}
  .nav{max-width:100%;border-radius:16px;overflow:hidden}
  .nbtn{padding:11px 2px 13px}
  .nbtn:not(:first-child)::before{top:22%;bottom:22%}
}
@media (max-width:520px){
  .title{font-size:20px}
  .subtitle{font-size:11px}
  .who-btn{padding:5px 9px;font-size:10px}
  .board-cell{padding:12px 6px}
  .b-score{font-size:22px}
  .day-name{font-size:11px}
  .day-pill,.day-prog{font-size:9px}
  .teams-head{padding:6px 10px;gap:8px}
  .teams-score{flex-wrap:wrap;justify-content:space-between;padding:9px 10px}
  .team,.team.r{flex:1 1 calc(50% - 26px)}
  .vs{order:3;width:auto;margin:6px auto 0;text-align:center}
  .vbtn{font-size:10px;padding:6px 6px}
  .vrow{grid-template-columns:1fr;row-gap:5px}
  .m-score,.odds-box,.bet-toggle,.reset-toggle,.gain-pill{width:100%;min-width:0;justify-content:center}
  .retenu-row{width:100%}
  .retenu-row.scoreline{flex-direction:column;align-items:stretch}
  .score-row .score-in{width:100%}
  .score-team{min-width:100%}
  .stats-table{min-width:560px}
  .group-grid{padding:0 10px;gap:10px}
  .grow{grid-template-columns:16px 1fr 26px 26px 26px 26px;padding:7px 12px;gap:6px;font-size:10px}
  .bracket-wrap{margin:0 10px;padding:8px 10px 12px}
  .past-phases{padding:0 10px 12px}
}
.rcard{margin:0 18px 18px;border:none;background:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 14px 30px rgba(15,29,49,.16),0 0 0 1px rgba(255,255,255,.78) inset}
.rcard.gold{box-shadow:0 16px 34px color-mix(in oklab,var(--ps,var(--fr)) 28%,rgba(15,29,49,.18)),0 0 0 1px rgba(255,255,255,.82) inset}
.rtop{display:flex;align-items:center;gap:13px;padding:8px 16px;background:#fff;color:var(--ink);position:relative;overflow:hidden;border-bottom:1px solid rgba(30,45,140,.08)}
.rmedal{font-size:22px;width:28px;text-align:center}
.rmedal.txt{font-size:22px}
.rname{font-family:var(--font-cond);font-size:17px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.rname.player{color:var(--ps,var(--ink));font-weight:900}
.rscore{margin-left:auto;font-size:32px;font-weight:900;line-height:1;letter-spacing:1px}
.rcard.gold .rscore{color:var(--ps,var(--fr))}
.runit{font-size:10px;color:var(--faint);font-weight:500;margin-left:3px}
.rbars{padding:22px 20px 28px;display:flex;flex-direction:column;gap:14px}
.brow{display:flex;align-items:center;gap:11px}
.blabel{font-family:var(--font-cond);font-size:11px;font-weight:800;color:var(--dim);width:84px;flex-shrink:0;letter-spacing:.8px;text-transform:uppercase}
.btrack{flex:1;height:10px;background:rgba(30,45,140,.09);border:none;border-radius:20px;overflow:hidden}
.bfill{height:100%;background:var(--accent);border-radius:20px;transition:width .7s cubic-bezier(.16,1,.3,1)}
.bfill.neutral{background:var(--dim)}
.bfill.player{background:var(--ps,var(--accent))}
.bfill.neutral.player{background:color-mix(in oklab,var(--ps,var(--accent)) 60%,#3a5080 40%)}
.bval{font-size:11px;color:var(--ink);width:42px;text-align:right;flex-shrink:0;font-weight:600}
.apero{margin:4px 18px 18px;border:none;border-radius:12px;padding:15px 18px;display:flex;align-items:center;gap:14px;background:#ffffff;box-shadow:0 12px 28px rgba(15,29,49,.14),0 0 0 1px rgba(255,255,255,.75) inset}
.apero-ico{font-size:26px}
.apero-txt{font-size:12px;color:var(--dim);line-height:1.5}
.apero-txt b{color:var(--ink);font-weight:600}
.apero-name{color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}
.scard{border:2px solid var(--line2);background:var(--card);padding:15px;border-radius:10px}
.slbl{font-size:9px;color:var(--faint);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.sval{font-size:28px;font-weight:700;line-height:.9;letter-spacing:-1px}
.sval.a{color:var(--accent)}
.ssub{font-size:10px;color:var(--faint);margin-top:7px;font-weight:500}
.stats-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:10px;padding:0 18px 12px;align-items:start}
.stats-panel{border:none;background:#ffffff;border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(15,29,49,.16),0 0 0 1px rgba(255,255,255,.78) inset;display:flex;flex-direction:column}
.stats-panel>.hero-grid{margin-top:auto}
.stats-panel::before{content:"";position:absolute;right:-18px;bottom:-22px;width:140px;height:140px;background:radial-gradient(circle at center,color-mix(in oklab,var(--fr) 16%, transparent) 0%,transparent 72%);pointer-events:none}
.stats-title{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);margin-bottom:10px;position:relative}
.hero-score{display:flex;align-items:flex-end;gap:14px;position:relative;padding-bottom:28px}
.hero-big{font-size:54px;line-height:.9;font-weight:800;letter-spacing:-2px;color:var(--ink)}
.hero-big small{font-size:15px;letter-spacing:0;color:var(--faint);margin-left:6px}
.hero-sub{font-size:13px;color:var(--dim);max-width:340px;line-height:1.45}
.stats-progress{margin-top:12px;display:grid;gap:6px}
.stats-progress-row{display:flex;align-items:center;justify-content:space-between;gap:8px}

.stats-bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 12px}

.stats-table-wrap{margin:0 18px 12px;border:none;background:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 14px 30px rgba(15,29,49,.16),0 0 0 1px rgba(255,255,255,.78) inset}

.curve-value.neg{color:var(--ko)}

.finance-list{display:grid;gap:6px;margin-top:4px;max-height:340px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(30,45,140,.2) transparent;padding-right:2px}

.finance-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border:none;border-radius:10px;background:#ffffff;box-shadow:0 8px 18px rgba(15,29,49,.12),0 0 0 1px rgba(255,255,255,.72) inset}

.finance-meta{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.7px;text-transform:uppercase;margin-top:3px}

.finance-pill.loss{color:var(--ko);background:color-mix(in oklab,var(--ko) 9%, white)}
.finance-pill.pending{color:var(--dim)}
.finance-amt{font-size:12px;font-weight:800}
.finance-amt.pos{color:var(--ok)}

@media (max-width:980px){
  .stats-hero{grid-template-columns:1fr}
  .stats-bars,.finance-grid{grid-template-columns:1fr}
  .hero-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

/* Bracket connectors: show how two matches feed the next round */
.br-side-col.r8 .br-match,
.br-side-col.rqf .br-match,
.br-side-col.rsf .br-match{position:relative}
.br-side.right .br-side-col.r8 .br-match::before,
.br-side.right .br-side-col.rqf .br-match::before,
.br-side.right .br-side-col.rsf .br-match::before{
  content:"";
  position:absolute;
  left:-16px;
  top:50%;
  width:16px;
  border-top:2px solid var(--line2);
}
.br-side.right .br-side-col.r8 .br-match::after,
.br-side.right .br-side-col.rqf .br-match::after,
.br-side.right .br-side-col.rsf .br-match::after{
  content:"";
  position:absolute;
  left:-16px;
  width:1px;
  background:var(--line2);
}
.br-side.left .br-side-col.r8 .br-match::before,
.br-side.left .br-side-col.rqf .br-match::before,
.br-side.left .br-side-col.rsf .br-match::before{
  content:"";
  position:absolute;
  right:-16px;
  top:50%;
  width:16px;
  border-top:2px solid var(--line2);
}
.br-side.left .br-side-col.r8 .br-match::after,
.br-side.left .br-side-col.rqf .br-match::after,
.br-side.left .br-side-col.rsf .br-match::after{
  content:"";
  position:absolute;
  right:-16px;
  width:1px;
  background:var(--line2);
}
.br-side.left .br-side-col.r8 .br-match::after,
.br-side.right .br-side-col.r8 .br-match::after{top:calc(50% - 47px);height:94px}
.br-side.left .br-side-col.rqf .br-match::after,
.br-side.right .br-side-col.rqf .br-match::after{top:calc(50% - 172px);height:344px}
.br-side.left .br-side-col.rsf .br-match::after,
.br-side.right .br-side-col.rsf .br-match::after{top:calc(50% - 172px);height:344px}

/* Keep semi-final to final gap visually symmetric: connectors come from the final card only */
.br-side.left .br-side-col.rsf .br-match::before,
.br-side.left .br-side-col.rsf .br-match::after,
.br-side.right .br-side-col.rsf .br-match::before,
.br-side.right .br-side-col.rsf .br-match::after{display:none}

async function loadAll(){
  setSync("busy");
  try{
    await ensureMatchsRows();
    const [pr,ma]=await Promise.all([db.from("pronostics").select("*"),db.from("matchs").select("id,resultat,score_dom,score_ext")]);
    if(pr.error)throw pr.error;if(ma.error)throw ma.error;
    const localColors={...customColorMap};
    const remoteColorMap={};
    const remoteSignatureState={};
    votes={};tieChoiceMap={};coteMap={};placedBetMap={};
    pr.data.forEach(row=>{
      if(row.participant===TIE_BREAK_PARTICIPANT){if(row.choix)tieChoiceMap[row.match_id]=row.choix;return;}
      if(row.participant===BET_PLACED_PARTICIPANT){if(row.choix==="1")placedBetMap[row.match_id]=true;return;}
      if(typeof row.participant==="string"&&row.participant.startsWith(COTE_PARTICIPANT_PREFIX)){const v=row.participant.slice(COTE_PARTICIPANT_PREFIX.length);if(v)coteMap[row.match_id]=v;return;}
      if(typeof row.participant==="string"&&row.participant.startsWith(COLOR_PARTICIPANT_PREFIX)){const name=row.participant.slice(COLOR_PARTICIPANT_PREFIX.length);if(PARTICIPANTS.includes(name)&&/^#[0-9a-fA-F]{6}$/.test(String(row.choix||"")))remoteColorMap[name]=row.choix;return;}
      if(typeof row.participant==="string"&&row.participant.startsWith(SIGNATURE_PARTICIPANT_PREFIX)){
        const rawName=row.participant.slice(SIGNATURE_PARTICIPANT_PREFIX.length);
        if(!rawName.includes(":"))return;
        const name=rawName.split(":")[0];
        if(!PARTICIPANTS.includes(name))return;
        try{
          const parsed=JSON.parse(String(row.choix||"{}"));
          const value=String(parsed.value||"").trim().slice(0,80);
          const cleared=!!parsed.cleared;
          const createdTms=Date.parse(String(row.created_at||""))||0;
          const payloadTsRaw=parsed.ts;
          const payloadTms=(typeof payloadTsRaw==="number"?payloadTsRaw:Number(payloadTsRaw))||Date.parse(String(payloadTsRaw||""))||0;
          const tms=Math.max(createdTms,payloadTms);
          const prev=remoteSignatureState[name];
          if(!prev||tms>=prev.tms)remoteSignatureState[name]={value,at:parsed.at?String(parsed.at):null,cleared,tms};
        }catch{}
        return;
      }
      const i=PARTICIPANTS.indexOf(row.participant);if(i<0)return;if(!votes[row.match_id])votes[row.match_id]=[null,null,null,null];votes[row.match_id][i]=row.choix;
    });
    const colorsToBackfill=Object.entries(localColors).filter(([name,color])=>PARTICIPANTS.includes(name)&&/^#[0-9a-fA-F]{6}$/.test(String(color||""))&&!remoteColorMap[name]);
    if(colorsToBackfill.length){
      await Promise.all(colorsToBackfill.map(([name,color])=>savePronostiqueurColorDb(name,color)));
      colorsToBackfill.forEach(([name,color])=>{remoteColorMap[name]=color;});
    }
    const remoteSignatureMap={};
    Object.entries(remoteSignatureState).forEach(([name,s])=>{
      if(!s.cleared&&String(s.value||"").trim())remoteSignatureMap[name]={value:String(s.value).slice(0,80),at:s.at||null};
    });
    // Do not backfill signatures from local storage: DB is the source of truth.
    customColorMap=remoteColorMap;
    contractSignatures=remoteSignatureMap;
    localStorage.setItem("cdm26_tie_choices",JSON.stringify(tieChoiceMap));
    localStorage.setItem("cdm26_cotes",JSON.stringify(coteMap));
    localStorage.setItem("cdm26_paris_places",JSON.stringify(placedBetMap));
    localStorage.setItem("cdm26_custom_colors",JSON.stringify(customColorMap));
    localStorage.setItem("cdm26_contract_signatures",JSON.stringify(contractSignatures));
    results={};scoreMap={};
    ma.data.forEach(row=>{const s1=row.score_dom==null?"":String(row.score_dom),s2=row.score_ext==null?"":String(row.score_ext);scoreMap[row.id]={s1,s2};results[row.id]=winnerFromScore(s1,s2)||row.resultat||null;});
    setSync("ok");showBanner(null);
  }catch(e){
    setSync("off");
    showBanner("Connexion à la base impossible — vérifie Supabase et la table 'matchs'. Données non enregistrées tant que ce message s'affiche.");
    console.error(e);
  }
}

function majorityCandidates(mv){const c={};mv.forEach(v=>{if(v)c[v]=(c[v]||0)+1;});if(!Object.keys(c).length)return [];const mx=Math.max(...Object.values(c));return Object.keys(c).filter(k=>c[k]===mx);}

function currentMatches(){
  let matches;
  if(filterPhase==="Groupes"){
    matches=filterGroupe==="Tous"?MG:filterGroupe==="France"?MG.filter(m=>m.fr):MG.filter(m=>m.g===filterGroupe);
  }else{
    const kval=buildKnockoutProjection(groupTables());
    matches=kval.fixtures
      .filter(m=>m.round===filterPhase)
      .map(m=>({id:m.id,date:m.date,h:m.h,t:m.round,e1:m.e1,e2:m.e2,fr:false}));
  }
  // Dates disponibles dans la sélection courante (avant filtre date)
  const dates=[...new Set(matches.map(m=>m.date))];
  // Applique le filtre date s'il est actif et présent dans la sélection
  if(filterDate!=="Toutes" && dates.includes(filterDate)) matches=matches.filter(m=>m.date===filterDate);
  if(filterTeam!=="Toutes") matches=matches.filter(m=>m.e1===filterTeam||m.e2===filterTeam);
  if(filterSearch.trim()){
    const q=filterSearch.trim().toLowerCase();
    matches=matches.filter(m=>`${m.e1} ${m.e2} ${m.g||""} ${m.t||""}`.toLowerCase().includes(q));
  }
  return {matches,dates};
}

function scoreOf(id){return scoreMap[id]||{s1:"",s2:""};}
function coteOf(id){return coteMap[id]==null?"":String(coteMap[id]);}
function betPlaced(id){return !!placedBetMap[id];}
function winnerFromScore(s1,s2){if(s1===""||s2==="")return null;const a=Number(s1),b=Number(s2);if(Number.isNaN(a)||Number.isNaN(b))return null;return a===b?"N":(a>b?"1":"2");}
function gainForMatch(id,maj,real){
  const cote=Number(String(coteOf(id)).replace(",","."));
  if(!Number.isFinite(cote)||cote<=0||!maj)return null;
  if(!real)return 4*cote-4;
  return maj===real?4*cote-4:-4;
}
function betSummary(matches,sc){
  return matches.reduce((acc,m)=>{
    if(!betPlaced(m.id))return acc;
    acc.count++;
    const maj=getMajority(votes[m.id]||[],sc,m.id),real=results[m.id];
    if(real){
      const gain=gainForMatch(m.id,maj,real);
      if(gain!=null)acc.settled+=gain;
    }else acc.pendingStake+=4;
    return acc;
  },{count:0,settled:0,pendingStake:0});
}

function groupTables(){
  const groups={};
  MG.forEach(m=>{if(!groups[m.g])groups[m.g]={};if(!groups[m.g][m.e1])groups[m.g][m.e1]={team:m.e1,pts:0,j:0,gf:0,ga:0,d:0};if(!groups[m.g][m.e2])groups[m.g][m.e2]={team:m.e2,pts:0,j:0,gf:0,ga:0,d:0};
    const s=scoreOf(m.id);if(s.s1===""||s.s2==="")return;const a=Number(s.s1),b=Number(s.s2);if(Number.isNaN(a)||Number.isNaN(b))return;
    const t1=groups[m.g][m.e1],t2=groups[m.g][m.e2];
    t1.j++;t2.j++;t1.gf+=a;t1.ga+=b;t2.gf+=b;t2.ga+=a;t1.d=t1.gf-t1.ga;t2.d=t2.gf-t2.ga;
    if(a>b)t1.pts+=3;else if(b>a)t2.pts+=3;else{t1.pts++;t2.pts++;}
  });
  // FIFA WC2026 tiebreaker: H2H pts → H2H GD → H2H GF → overall GD → overall GF → alphabetical
  const h2h=(g,tset)=>{
    const h={};tset.forEach(t=>{h[t]={pts:0,gf:0,ga:0};});
    MG.filter(m=>m.g===g&&tset.has(m.e1)&&tset.has(m.e2)).forEach(m=>{
      const s=scoreOf(m.id);if(s.s1===""||s.s2==="")return;
      const a=Number(s.s1),b=Number(s.s2);if(Number.isNaN(a)||Number.isNaN(b))return;
      h[m.e1].gf+=a;h[m.e1].ga+=b;h[m.e2].gf+=b;h[m.e2].ga+=a;
      if(a>b)h[m.e1].pts+=3;else if(b>a)h[m.e2].pts+=3;else{h[m.e1].pts++;h[m.e2].pts++;}
    });
    return h;
  };
  const fifaSort=(g,arr)=>{
    if(arr.length<=1)return arr;
    const byPts={};arr.forEach(t=>{(byPts[t.pts]=byPts[t.pts]||[]).push(t);});
    return Object.keys(byPts).sort((a,b)=>b-a).flatMap(pts=>{
      const grp=byPts[pts];if(grp.length===1)return grp;
      const tset=new Set(grp.map(t=>t.team));
      const hh=h2h(g,tset);
      grp.sort((a,b)=>{
        const ha=hh[a.team],hb=hh[b.team];
        return hb.pts-ha.pts||(hb.gf-hb.ga)-(ha.gf-ha.ga)||hb.gf-ha.gf||b.d-a.d||b.gf-a.gf||(FIFA_RANKS[a.team]||999)-(FIFA_RANKS[b.team]||999)||a.team.localeCompare(b.team);
      });
      return grp;
    });
  };
  const sorted={};
  Object.keys(groups).sort().forEach(g=>{sorted[g]=fifaSort(g,Object.values(groups[g]));});
  return sorted;
}
function buildKnockoutProjection(tables){
  const first={},second={},third=[];
  Object.keys(tables).forEach(g=>{const arr=tables[g];if(arr[0])first[g]=arr[0].team;if(arr[1])second[g]=arr[1].team;if(arr[2])third.push({group:g,...arr[2]});});
  const bestThirdEntries=third.sort((a,b)=>b.pts-a.pts||b.d-a.d||b.gf-a.gf||(FIFA_RANKS[a.team]||999)-(FIFA_RANKS[b.team]||999)||a.team.localeCompare(b.team)).slice(0,8);
  const bestThirdRanking=bestThirdEntries.map(x=>x.team);
  const ctx={first,second,bestThirdEntries,usedThirdGroups:new Set(),winners:{},losers:{}};
  const fixtures=MKO.map(m=>{
    const e1=resolveKoLabel(m.e1,ctx);
    const e2=resolveKoLabel(m.e2,ctx);
    const s=scoreOf(m.id);
    const hasScore=s.s1!==""&&s.s2!=="";
    if(hasScore){
      const a=Number(s.s1),b=Number(s.s2);
      if(!Number.isNaN(a)&&!Number.isNaN(b)&&a!==b){
        ctx.winners[m.id]=a>b?e1:e2;
        ctx.losers[m.id]=a>b?e2:e1;
      }
    }
    return {id:m.id,round:m.t,date:m.date,h:m.h,e1,e2,s1:s.s1,s2:s.s2};
  });
  return {bestThirdRanking,fixtures};
}
function resolveKoLabel(lbl,ctx){
  if(lbl.startsWith("1er Gr.")){const g=lbl.replace("1er Gr.","");return ctx.first[g]||lbl;}
  if(lbl.startsWith("2e Gr.")){const g=lbl.replace("2e Gr.","");return ctx.second[g]||lbl;}
  if(/^3[A-L]+$/.test(lbl)){
    const allowed=new Set(lbl.slice(1).split(""));
    const pick=ctx.bestThirdEntries.find(x=>allowed.has(x.group)&&!ctx.usedThirdGroups.has(x.group));
    if(pick){ctx.usedThirdGroups.add(pick.group);return pick.team;}
    return lbl;
  }
  if(lbl.startsWith("V.M")){const id=Number(lbl.replace("V.M",""));return ctx.winners[id]||lbl;}
  if(lbl.startsWith("Perdant M")){const id=Number(lbl.replace("Perdant M",""));return ctx.losers[id]||lbl;}
  return lbl;
}
function labelTeamWithFlag(n){return FLAGS[n]?`<span class="br-name">${flagImg(n,"flag-sm")}<span>${n}</span></span>`:`<span class="br-name"><span>${n}</span></span>`;}
function renderKnockout(fixtures){
  const byId=Object.fromEntries(fixtures.map(x=>[x.id,x]));
  const rawById=Object.fromEntries(MKO.map(x=>[x.id,x]));
  const prevIds=id=>{
    const m=rawById[id];
    if(!m)return[];
    return [m.e1,m.e2].map(v=>v.startsWith("V.M")?Number(v.replace("V.M","")):null).filter(v=>v!==null);
  };
  const sideFromSemi=semiId=>{
    const qf=prevIds(semiId);
    const r8=qf.flatMap(prevIds);
    const r16=r8.flatMap(prevIds);
    return {
      semi:[semiId].map(id=>byId[id]).filter(Boolean),
      qf:qf.map(id=>byId[id]).filter(Boolean),
      r8:r8.map(id=>byId[id]).filter(Boolean),
      r16:r16.map(id=>byId[id]).filter(Boolean)
    };
  };
  const left=sideFromSemi(101);
  const right=sideFromSemi(102);
  const r3=fixtures.filter(x=>x.round==="3ème place");
  const rf=fixtures.filter(x=>x.round==="FINALE");
  const card=x=>{const has=x.s1!==""&&x.s2!=="";const a=Number(x.s1),b=Number(x.s2);const w=has&&a!==b?(a>b?"1":"2"):null;return `<div class="br-match" onclick="goToMatch(${x.id})"><div class="br-mhead"><span>M${x.id}</span><span>${x.date} · ${x.h}</span></div><div class="br-team ${w==="1"?"win":""}">${labelTeamWithFlag(x.e1)}<span class="br-goals">${has?x.s1:""}</span></div><div class="br-team ${w==="2"?"win":""}">${labelTeamWithFlag(x.e2)}<span class="br-goals">${has?x.s2:""}</span></div></div>`;};
  const col=(title,list,cls)=>`<div class="br-side-col ${cls}"><div class="br-col-title">${title}</div><div class="br-list">${list.length?list.map(card).join(''):"<div class='ko-line'>En attente</div>"}</div></div>`;
  return `<div class="bracket-wrap"><div class="br-main"><div class="br-side left">${col("1/16",left.r16,"r16")}${col("1/8",left.r8,"r8")}${col("Quarts",left.qf,"rqf")}${col("Demi",left.semi,"rsf")}</div><div class="br-center">${col("Finale",rf,"rf")}${col("3e place",r3,"r3")}</div><div class="br-side right">${col("Demi",right.semi,"rsf")}${col("Quarts",right.qf,"rqf")}${col("1/8",right.r8,"r8")}${col("1/16",right.r16,"r16")}</div></div></div>`;
}
function renderResultats(){
  const phases=["Groupes","1/16","1/8","Quart","Demi","FINALE"];
  let matches=filterPhase==="Groupes"?(filterGroupe==="Tous"?MG:filterGroupe==="France"?MG.filter(m=>m.fr):MG.filter(m=>m.g===filterGroupe)):MKO.filter(m=>m.t===filterPhase);
  const groups=["Tous","France",...[...new Set(MG.map(m=>m.g))].sort()];
  const dates=[...new Set(matches.map(m=>m.date))];
  if(filterDate!=="Toutes"&&dates.includes(filterDate))matches=matches.filter(m=>m.date===filterDate);

  const tables=groupTables();
  const kval=buildKnockoutProjection(tables);
  const mRows=matches.map(m=>{const s=scoreOf(m.id);const filled=s.s1!==""&&s.s2!=="";return `<div class="admin-card ${filled?"filled":""}"><div class="admin-head"><span class="admin-id">M${String(m.id).padStart(3,"0")}</span><span class="admin-when">${m.date} · ${m.h}</span><span class="c-tag">${m.g?`Groupe ${m.g}`:m.t}</span></div><div class="score-row"><div class="score-team">${flagImg(m.e1,"flag-sm")}<span class="score-name">${m.e1}</span></div><input class="score-in" type="number" min="0" step="1" value="${s.s1}" oninput="setScoreDraft(${m.id},'s1',this.value,this)"><span class="score-vs">-</span><input class="score-in" type="number" min="0" step="1" value="${s.s2}" oninput="setScoreDraft(${m.id},'s2',this.value,this)"><div class="score-team" style="justify-content:flex-end">${flagImg(m.e2,"flag-sm")}<span class="score-name">${m.e2}</span></div></div></div>`;}).join('');
  const groupHtml=Object.keys(tables).map(g=>`<div class="gcard"><div class="ghead">Groupe ${g}</div>${tables[g].map((t,i)=>`<div class="grow"><span class="gpos">${i+1}</span><span class="gteam">${flagImg(t.team,"flag-sm")}<span class="gname">${t.team}</span></span><span class="gnum">${t.pts}</span><span class="gnum">${t.d}</span><span class="gnum">${t.gf}</span><span class="gnum">${t.j}</span></div>`).join('')}</div>`).join('');
  const thirdLine=kval.bestThirdRanking.length?`<div class="ko-line"><b>3e meilleurs</b>${kval.bestThirdRanking.join(" · ")}</div>`:"";
  const filters=`<div class="scroller">${phases.map(p=>`<button class="chip ${filterPhase===p?'on':''}" onclick="setPhase('${p}')">${p==="Groupes"?"Phase de groupes":p==="FINALE"?"Finale":p}</button>`).join('')}</div>${filterPhase==="Groupes"?`<div class="scroller sub">${groups.map(g=>`<button class="chip ${filterGroupe===g?'on':''}" onclick="setGroupe('${g}')">${g==="Tous"?"Tous":g==="France"?"France":"Gr. "+g}</button>`).join('')}</div>`:''}<div class="datebar"><span class="datebar-lbl">📅 Aller à</span><select class="datesel" onchange="setFilterDate(this.value)"><option value="Toutes" ${filterDate==="Toutes"?'selected':''}>Toutes les dates</option>${dates.map(d=>`<option value="${d}" ${filterDate===d?'selected':''}>${dayLabel(d)}</option>`).join('')}</select>${filterDate!=="Toutes"?`<button class="datereset" onclick="setFilterDate('Toutes')">✕</button>`:''}</div>`;
  return `${filters}<div class="slabel"><span class="slabel-text">Saisie des scores</span><span class="slabel-line"></span><span class="slabel-count">${matches.length} matchs</span></div>${mRows}<div class="slabel"><span class="slabel-text">Classements groupes</span><span class="slabel-line"></span><span class="slabel-count">Pts / Diff / BP / J</span></div><div class="group-grid">${groupHtml}</div><div class="slabel"><span class="slabel-text">Phase éliminatoire</span><span class="slabel-line"></span></div>${thirdLine}${renderKnockout(kval.fixtures)}<div style="height:18px"></div>`;
}

window.updateContractSignatureDraft=function(name,value){if(!PARTICIPANTS.includes(name))return;const cur=contractSignatures[name]||{};contractSignatures[name]={...cur,value:String(value||"").slice(0,80)};localStorage.setItem("cdm26_contract_signatures",JSON.stringify(contractSignatures));};
window.signContract=async function(name){
  if(!PARTICIPANTS.includes(name))return;
  const cur=contractSignatures[name]||{};

  const dt=new Date();
  const stamp=`${String(dt.getDate()).padStart(2,"0")}/${String(dt.getMonth()+1).padStart(2,"0")}/${dt.getFullYear()} ${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`;
  contractSignatures[name]={value,at:stamp};
  localStorage.setItem("cdm26_contract_signatures",JSON.stringify(contractSignatures));
  if(tab==="regles")render();
  setSync("busy");
  try{await saveContractSignatureDb(name,contractSignatures[name]);setSync("ok");showBanner(null);}catch(e){setSync("off");showBanner("Échec de l'enregistrement de la signature — base injoignable.");console.error(e);} 
};

window.setScoreDraft=function(id,key,val,el){
  if(!scoreMap[id])scoreMap[id]={s1:"",s2:""};
  const cleaned=String(val).replace(/[^0-9]/g,"");
  scoreMap[id][key]=cleaned;
  if(el&&el.value!==cleaned)el.value=cleaned;

  const card=el?el.closest(".card, .admin-card"):null;
  const filled=scoreMap[id].s1!==""&&scoreMap[id].s2!=="";
  if(card)card.classList.toggle("filled",filled);

  if(scoreSaveTimers[id])clearTimeout(scoreSaveTimers[id]);
  if(filled){
    scoreSaveTimers[id]=setTimeout(()=>saveScore(id),450);
  }
};
window.setCoteDraft=function(id,val,el){
  let cleaned=String(val).replace(/,/g,'.').replace(/[^0-9.]/g,'');
  const p=cleaned.split('.');
  if(p.length>2)cleaned=`${p.shift()}.${p.join('')}`;
  coteMap[id]=cleaned;
  if(!cleaned)delete coteMap[id];
  localStorage.setItem("cdm26_cotes",JSON.stringify(coteMap));
  if(el&&el.value!==cleaned)el.value=cleaned;
  if(tab==="matchs")renderMatchsOnly();
  else render();
  setSync("busy");
  saveCoteDb(id,cleaned).then(()=>{setSync("ok");showBanner(null);}).catch(e=>{setSync("off");showBanner("Échec de l'enregistrement — base injoignable.");console.error(e);});
};
window.resetMatchAdmin=async function(id){
  if(scoreSaveTimers[id])clearTimeout(scoreSaveTimers[id]);
  scoreMap[id]={s1:"",s2:""};
  results[id]=null;
  delete coteMap[id];
  delete tieChoiceMap[id];
  localStorage.setItem("cdm26_cotes",JSON.stringify(coteMap));
  localStorage.setItem("cdm26_tie_choices",JSON.stringify(tieChoiceMap));
  render();
  setSync("busy");
  try{
    const [{error:scoreErr},{error:tieErr},{error:betErr},{error:coteErr}]=await Promise.all([
      db.from("matchs").update({score_dom:null,score_ext:null}).eq("id",id),
      db.from("pronostics").delete().match({match_id:id,participant:TIE_BREAK_PARTICIPANT}),
      db.from("pronostics").delete().match({match_id:id,participant:BET_PLACED_PARTICIPANT}),
      db.from("pronostics").delete().like("participant",`${COTE_PARTICIPANT_PREFIX}%`).eq("match_id",id)
    ]);
    if(scoreErr)throw scoreErr;
    if(tieErr)throw tieErr;
    if(betErr)throw betErr;
    if(coteErr)throw coteErr;
    setSync("ok");showBanner(null);
  }catch(e){setSync("off");showBanner("Échec de la réinitialisation — base injoignable.");console.error(e);} 
};
window.toggleBetPlaced=function(id){
  placedBetMap[id]=!placedBetMap[id];
  if(!placedBetMap[id])delete placedBetMap[id];
  localStorage.setItem("cdm26_paris_places",JSON.stringify(placedBetMap));
  if(tab==="matchs")renderMatchsOnly();
  else render();
  setSync("busy");
  saveBetPlacedDb(id,!!placedBetMap[id]).then(()=>{setSync("ok");showBanner(null);}).catch(e=>{setSync("off");showBanner("Échec de l'enregistrement — base injoignable.");console.error(e);});
};
window.saveScore=async function(id){
  const s=scoreOf(id);
  if(s.s1===""||s.s2==="")return;
  scoreMap[id]={s1:String(Math.max(0,parseInt(s.s1,10)||0)),s2:String(Math.max(0,parseInt(s.s2,10)||0))};
  const s1=Number(scoreMap[id].s1),s2=Number(scoreMap[id].s2);
  results[id]=winnerFromScore(scoreMap[id].s1,scoreMap[id].s2);
  render();setSync("busy");
  try{
    const {error}=await db.from("matchs").update({score_dom:s1,score_ext:s2}).eq("id",id);
    if(error)throw error;
    setSync("ok");showBanner(null);
  }catch(e){setSync("off");showBanner("Échec de l'enregistrement — base injoignable.");console.error(e);} 
};
window.vote=async function(id,pi,v){
  if(me!==PARTICIPANTS[pi])return;
  if(betPlaced(id)){showBanner("Pronostics verrouillés : pari déjà placé pour ce match.");return;}
  const cur=votes[id]?[...votes[id]]:[null,null,null,null];
  const newv=cur[pi]===v?null:v;cur[pi]=newv;votes[id]=cur;updateMatchCard(id);
  const tieOptions=majorityCandidates(cur);
  const shouldClearTie=tieOptions.length<=1||!tieOptions.includes(tieChoiceMap[id]);
  if(shouldClearTie){delete tieChoiceMap[id];localStorage.setItem("cdm26_tie_choices",JSON.stringify(tieChoiceMap));}
  setSync("busy");
  try{
    if(newv===null){const {error}=await db.from("pronostics").delete().match({match_id:id,participant:PARTICIPANTS[pi]});if(error)throw error;}
    else{const {error}=await db.from("pronostics").upsert({match_id:id,participant:PARTICIPANTS[pi],choix:newv});if(error)throw error;}
    if(shouldClearTie)await saveTieChoiceDb(id,null);
    setSync("ok");showBanner(null);
  }catch(e){setSync("off");showBanner("Échec de l'enregistrement — base injoignable.");console.error(e);}
};
window.setTieDecision=async function(id,v){
  const opts=majorityCandidates(votes[id]||[]);
  if(opts.length<=1||!opts.includes(v))return;
  if(tieChoiceMap[id]===v)delete tieChoiceMap[id];
  else tieChoiceMap[id]=v;
  localStorage.setItem("cdm26_tie_choices",JSON.stringify(tieChoiceMap));
  if(tab==="matchs")renderMatchsOnly();else render();
  setSync("busy");
  try{await saveTieChoiceDb(id,tieChoiceMap[id]||null);setSync("ok");showBanner(null);}catch(e){setSync("off");showBanner("Échec de l'enregistrement — base injoignable.");console.error(e);} 
};
window.setResult=async function(id,v){
  results[id]=v||null;render();setSync("busy");
  try{
    let score_dom=null,score_ext=null;
    if(v==="1"){score_dom=1;score_ext=0;}
    else if(v==="2"){score_dom=0;score_ext=1;}
    else if(v==="N"){score_dom=0;score_ext=0;}
    scoreMap[id]={s1:score_dom==null?"":String(score_dom),s2:score_ext==null?"":String(score_ext)};
    const {error}=await db.from("matchs").update({score_dom,score_ext}).eq("id",id);
    if(error)throw error;
    setSync("ok");showBanner(null);
  }catch(e){setSync("off");showBanner("Échec de l'enregistrement — base injoignable.");console.error(e);}
};
window.setTab=function(t){if(t==="resultats")t="matchs";tab=t;document.querySelectorAll(".nbtn").forEach(b=>b.classList.remove("on"));const nav=document.getElementById("nav-"+t);if(nav)nav.classList.add("on");document.querySelector(".app").classList.toggle("wide",t==="competition");document.getElementById("content").scrollTop=0;render();};
window.goToMatch=function(id){
  const base=ALL.find(m=>m.id===id);
  if(!base)return;
  filterSearch="";
  filterTeam="Toutes";
  filterDate=base.date;
  if(base.g){
    filterPhase="Groupes";
    filterGroupe=base.g;
  }else{
    const kval=buildKnockoutProjection(groupTables());
    const fixture=kval.fixtures.find(m=>m.id===id);
    filterPhase=(fixture&&fixture.round)||base.t||"FINALE";
    filterGroupe="Tous";
  }
  openDays[dayLabel(base.date)]=true;
  tab="matchs";
  document.querySelectorAll(".nbtn").forEach(b=>b.classList.remove("on"));
  const nav=document.getElementById("nav-matchs");
  if(nav)nav.classList.add("on");
  document.querySelector(".app").classList.toggle("wide",false);
  render();
  requestAnimationFrame(()=>{
    const target=document.getElementById(`match-${id}`);
    if(target)target.scrollIntoView({block:"start",behavior:"smooth"});
  });
};
window.setPhase=function(p){filterPhase=p;render();};
window.setGroupe=function(g){filterGroupe=g;render();};
window.setFilterSearch=function(v){filterSearch=v;renderMatchListOnly();};
window.setFilterTeam=function(v){filterTeam=v;renderMatchsOnly();};

// Rafraîchit les données puis redessine SANS casser le scroll ni les sections ouvertes
async function softRefresh(){
  const c=document.getElementById("content");
  const y=c?c.scrollTop:0,wy=window.scrollY;
  await loadAll();
  if(tab==="matchs"){const sc=computeScores();renderWho();renderBoard(sc);c.innerHTML=renderMatchs(sc);c.scrollTop=y;}
  else render();
  window.scrollTo(0,wy);
}

async function refresh(){
  await loadAll();
  applyPronostiqueurTheme(me);
  if(!collapseInit){
    collapseInit=true;
    // On regroupe tous les matchs (groupes + finales) par jour, dans l'ordre chrono
    const byDay={};const order=[];
    ALL.forEach(m=>{const l=dayLabel(m.date);if(!byDay[l]){byDay[l]=[];order.push(l);}byDay[l].push(m);});
    // Journée cible : la 1re qui n'est PAS passée et dont au moins un match n'a pas de résultat.
    // À défaut (tournoi fini), on ouvre la dernière journée.
    let target=order.find(l=>{
      const ms=byDay[l];
      const past=isPastDay(ms[0].date);
      const allDone=ms.every(m=>results[m.id]);
      return !past && !allDone;
    });
    if(!target) target=order.find(l=>byDay[l].some(m=>!results[m.id]))||order[order.length-1];
    if(target)openDays[target]=true;
  }
  render();
}

// ── Temps réel : on écoute les changements et on rafraîchit aussitôt ──
function subscribeRealtime(){
  db.channel("cdm26")
    .on("postgres_changes",{event:"*",schema:"public",table:"pronostics"},softRefresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"matchs"},softRefresh)
    .subscribe();
}


applyPronostiqueurTheme(me);
refresh();
subscribeRealtime();
setInterval(refresh,20000); // filet de sécurité si le temps réel se coupe
</script>
