<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronostics CDM 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#faf9f6;--card:#ffffff;--ink:#1c1c1a;--dim:#6e6e68;--faint:#a3a39c;
  --line:#e9e8e2;--line2:#dedcd4;--accent:#3a6b4a;--accent-soft:#eef2ee;
  --fr:#3a5a8c;--ok:#3a6b4a;--ko:#9a5450;
}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-feature-settings:"tnum"}
::-webkit-scrollbar{width:0;height:0}
.app{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);position:relative}
.app.wide{max-width:1800px}
.header{padding:24px 24px 18px;border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:100;background:rgba(250,249,246,.94);backdrop-filter:blur(10px)}
.h-row{display:flex;align-items:flex-start;justify-content:space-between}
.eyebrow{font-size:10px;letter-spacing:3px;color:var(--faint);text-transform:uppercase;font-weight:600;margin-bottom:7px}
.title{font-size:22px;font-weight:700;letter-spacing:-.4px;line-height:1}
.subtitle{font-size:12px;color:var(--dim);margin-top:7px;font-weight:400}
.who{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
.who-btn{padding:5px 11px;border:1px solid var(--line2);border-radius:30px;background:var(--card);color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.who-btn:hover{border-color:var(--ink);color:var(--ink)}
.who-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sync{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--faint);font-weight:500;white-space:nowrap}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);transition:background .3s}
.sync-dot.off{background:var(--ko)}
.sync-dot.busy{background:#d0a030;animation:bl .8s infinite}
@keyframes bl{50%{opacity:.3}}
.board{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line2)}
.board-cell{padding:15px 8px 14px;text-align:center;border-right:1px solid var(--line);position:relative}
.board-cell:last-child{border-right:none}
.board-cell.lead::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--accent)}
.b-rank{font-size:10px;color:var(--faint);font-weight:600;margin-bottom:4px}
.b-name{font-size:11px;font-weight:600;color:var(--dim);margin-bottom:6px}
.board-cell.lead .b-name{color:var(--accent)}
.b-score{font-size:26px;font-weight:700;line-height:1;color:var(--ink);letter-spacing:-.5px}
.board-cell.lead .b-score{color:var(--accent)}
.b-pct{font-size:10px;color:var(--faint);margin-top:5px;font-weight:500}
.content{flex:1;overflow-y:auto;padding-bottom:78px}
.scroller{display:flex;gap:7px;padding:16px 20px 4px;overflow-x:auto;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.chip{padding:7px 15px;border:1px solid var(--line2);border-radius:30px;background:var(--card);color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;font-family:inherit}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.scroller.sub .chip{padding:5px 12px;font-size:10px}
.slabel{display:flex;align-items:center;gap:11px;padding:18px 24px 10px}
.slabel-text{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.slabel-line{flex:1;height:1px;background:var(--line2)}
.slabel-count{font-size:10px;color:var(--faint);font-weight:600}
/* En-tête de journée (collapsible) */
.day{display:flex;align-items:center;gap:11px;width:calc(100% - 36px);margin:14px 18px 4px;padding:10px 14px;border:1px solid var(--line2);background:var(--card);border-radius:10px;cursor:pointer;font-family:inherit;transition:border-color .15s}
.day:hover{border-color:var(--ink)}
.day-chev{font-size:11px;color:var(--faint);transition:transform .2s;flex-shrink:0}
.day.open .day-chev{transform:rotate(90deg)}
.day-name{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.day-meta{margin-left:auto;display:flex;align-items:center;gap:8px}
.day-prog{font-size:10px;color:var(--faint);font-weight:600}
.day-pill{font-size:10px;color:var(--dim);font-weight:600;background:var(--paper);border:1px solid var(--line2);padding:2px 8px;border-radius:20px}
.day.finished{opacity:.62}
.day.finished:hover{opacity:1}
.day-prog.done{color:var(--accent)}
.datebar{display:flex;align-items:center;gap:9px;padding:12px 20px 2px}
.datebar-lbl{font-size:11px;font-weight:600;color:var(--dim);white-space:nowrap}
.datesel{flex:1;background:var(--card);border:1px solid var(--line2);color:var(--ink);font-size:12px;font-weight:500;padding:8px 10px;cursor:pointer;font-family:inherit;border-radius:8px}
.datesel:focus{outline:none;border-color:var(--accent)}
.datereset{background:var(--card);border:1px solid var(--line2);color:var(--dim);font-size:12px;font-weight:600;padding:8px 11px;cursor:pointer;font-family:inherit;border-radius:8px;flex-shrink:0;transition:all .15s}
.datereset:hover{border-color:var(--ink);color:var(--ink)}
.day-body{overflow:hidden}
.card{margin:0 18px 9px;border:1px solid var(--line2);background:var(--card);border-radius:10px;overflow:hidden;transition:border-color .2s}
.card:hover{border-color:var(--line)}
.card.fr{border-left:2px solid var(--fr)}
/* Carte repliée : ligne compacte cliquable */
.card-top{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.card.collapsed .card-top{border-bottom:none}
.card.collapsed .teams{padding:10px 14px}
.card-chev{font-size:10px;color:var(--faint);transition:transform .2s;margin-left:2px}
.card:not(.collapsed) .card-chev{transform:rotate(90deg)}
.mini-status{margin-left:auto;display:flex;align-items:center;gap:7px}
.mini-pron{font-size:11px;font-weight:600;color:var(--accent)}
.mini-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mini-dot.done{background:var(--accent)}
.mini-dot.partial{background:#d0a030}
.mini-dot.empty{background:var(--line2)}
.collapsible{overflow:hidden;transition:none}
.c-num{font-size:10px;color:var(--faint);font-weight:600}
.c-when{font-size:11px;color:var(--dim);font-weight:500}
.c-tag{margin-left:auto;font-size:9px;font-weight:600;letter-spacing:.8px;padding:3px 9px;background:var(--paper);border:1px solid var(--line2);color:var(--dim);border-radius:20px;text-transform:uppercase}
.c-tag.frtag{background:var(--card);border-color:var(--fr);color:var(--fr)}
.teams{display:flex;align-items:center;padding:14px}
.team{flex:1;display:flex;align-items:center;gap:9px}
.team.r{flex-direction:row-reverse;text-align:right}
.flag{width:22px;height:22px;object-fit:contain;flex-shrink:0}
.flag-sm{width:14px;height:14px;object-fit:contain;flex-shrink:0}
.with-flag{display:inline-flex;align-items:center;gap:4px}
.tname{font-size:14px;font-weight:600;line-height:1.15}
.vs{font-size:10px;color:var(--faint);padding:0 12px;font-weight:600;letter-spacing:1px}
.votes{padding:3px 14px 14px;border-top:1px solid var(--line)}
.vrow{display:flex;align-items:center;gap:10px;padding:5px 0}
.vname{font-size:11px;font-weight:600;width:56px;flex-shrink:0;color:var(--dim)}
.vname.me{color:var(--accent);font-weight:700}
.vopts{display:flex;gap:5px;flex:1}
.vbtn{flex:1;padding:7px 4px;border:1px solid var(--line2);background:var(--paper);color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .14s;font-family:inherit;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:6px}
.vbtn:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.vbtn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.vbtn:disabled{cursor:default;opacity:.85}
.vbtn.locked.on{background:var(--dim);border-color:var(--dim)}
.retenu{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.retenu-main{display:flex;align-items:center;gap:10px;justify-content:center;min-width:0}
.retenu-tools{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.retenu-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.retenu-row.scoreline{justify-content:center}
.rlabel{font-size:9px;font-weight:600;letter-spacing:1px;color:var(--faint);text-transform:uppercase}
.rval{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:4px 11px;border-radius:6px}
.rpending{font-size:11px;color:var(--faint);font-style:italic}
.rsel{margin-left:auto;background:var(--paper);border:1px solid var(--line2);color:var(--ink);font-size:11px;font-weight:500;padding:6px 9px;cursor:pointer;font-family:inherit;border-radius:6px}
.rsel:focus{outline:none;border-color:var(--accent)}
.m-score{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--paper);border-radius:8px;padding:4px 6px}
.m-score.filled{border-color:var(--ok);box-shadow:0 0 0 1px color-mix(in oklab,var(--ok) 25%, transparent)}
.m-score .score-in{width:34px;padding:5px 2px;font-size:12px}
.m-score .score-vs{font-size:9px}
.odds-box{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--paper);border-radius:8px;padding:4px 6px}
.odds-in{width:56px;padding:5px 4px;border:1px solid var(--line2);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:12px;text-align:center}
.odds-in:focus{outline:none;border-color:var(--accent)}
.gain-pill{font-size:11px;font-weight:600;border-radius:20px;padding:5px 10px;border:1px solid var(--line2);background:var(--paper);color:var(--dim)}
.gain-pill.win{border-color:var(--ok);color:var(--ok);background:color-mix(in oklab,var(--ok) 12%, white)}
.gain-pill.loss{border-color:var(--ko);color:var(--ko);background:color-mix(in oklab,var(--ko) 10%, white)}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%}
.badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px}
.badge.ok{background:var(--accent-soft);color:var(--ok)}
.badge.ko{background:#f6ecec;color:var(--ko)}
@media (max-width:760px){
  .retenu-main{justify-content:flex-start}
  .retenu-tools{justify-content:flex-start}
  .retenu-row.scoreline{justify-content:flex-start}
}
.rcard{margin:0 18px 12px;border:1px solid var(--line2);background:var(--card);border-radius:10px;overflow:hidden}
.rcard.gold{border-color:var(--accent)}
.rtop{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line)}
.rmedal{font-size:22px;width:28px;text-align:center}
.rmedal.txt{font-size:15px;font-weight:700;color:var(--faint)}
.rname{font-size:16px;font-weight:600}
.rscore{margin-left:auto;font-size:30px;font-weight:700;line-height:1;letter-spacing:-1px}
.rcard.gold .rscore{color:var(--accent)}
.runit{font-size:10px;color:var(--faint);font-weight:500;margin-left:3px}
.rbars{padding:14px 16px;display:flex;flex-direction:column;gap:11px}
.brow{display:flex;align-items:center;gap:11px}
.blabel{font-size:10px;color:var(--dim);width:84px;flex-shrink:0;letter-spacing:.3px;text-transform:uppercase;font-weight:600}
.btrack{flex:1;height:5px;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.bfill{height:100%;background:var(--accent);border-radius:20px;transition:width .7s cubic-bezier(.16,1,.3,1)}
.bfill.neutral{background:var(--dim)}
.bval{font-size:11px;color:var(--ink);width:42px;text-align:right;flex-shrink:0;font-weight:600}
.apero{margin:4px 18px 18px;border:1px solid var(--line2);border-radius:10px;padding:15px 18px;display:flex;align-items:center;gap:14px;background:var(--card)}
.apero-ico{font-size:26px}
.apero-txt{font-size:12px;color:var(--dim);line-height:1.5}
.apero-txt b{color:var(--ink);font-weight:600}
.apero-name{color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}
.scard{border:1px solid var(--line2);background:var(--card);padding:15px;border-radius:10px}
.slbl{font-size:9px;color:var(--faint);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.sval{font-size:28px;font-weight:700;line-height:.9;letter-spacing:-1px}
.sval.a{color:var(--accent)}
.ssub{font-size:10px;color:var(--faint);margin-top:7px;font-weight:500}
.rule{margin:0 18px 9px;border:1px solid var(--line2);background:var(--card);padding:13px 16px;display:flex;gap:13px;align-items:flex-start;border-radius:10px}
.rule-ico{font-size:17px;flex-shrink:0;opacity:.7}
.rule-t{font-size:12px;font-weight:600;margin-bottom:3px}
.rule-d{font-size:12px;color:var(--dim);line-height:1.4}
.admin-card{margin:0 18px 10px;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:12px 14px}
.admin-card.filled{border-color:var(--ok);box-shadow:0 0 0 1px color-mix(in oklab,var(--ok) 30%, transparent)}
.admin-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.admin-id{font-size:10px;color:var(--faint);font-weight:600}
.admin-when{font-size:11px;color:var(--dim);font-weight:600}
.score-row{display:flex;align-items:center;gap:8px}
.score-team{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.score-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-in{width:46px;border:1px solid var(--line2);background:var(--paper);border-radius:6px;padding:6px 4px;text-align:center;font:600 13px/1 Inter,sans-serif;color:var(--ink)}
.score-in:focus{outline:none;border-color:var(--accent)}
.score-vs{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:1px}
.group-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}
.gcard{border:1px solid var(--line2);background:var(--card);border-radius:10px;overflow:hidden}
.ghead{padding:10px 12px;border-bottom:1px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.grow{display:grid;grid-template-columns:20px 1fr 26px 26px 26px 26px;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.grow:first-of-type{border-top:none}
.gpos{font-size:10px;color:var(--faint);font-weight:700}
.gteam{font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.gteam span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gnum{font-size:10px;color:var(--dim);text-align:right;font-weight:700}
.ko-line{margin:0 18px 8px;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--ink)}
.ko-line b{font-size:10px;color:var(--faint);margin-right:7px;letter-spacing:.8px}
.bracket-wrap{padding:8px 18px 14px;overflow-x:auto;background:linear-gradient(180deg,#fdfcf9 0%,#f7f6f2 100%);border:1px solid var(--line2);border-radius:12px;margin:0 18px}
.br-main{display:grid;grid-template-columns:auto 190px auto;gap:12px;min-width:1600px;align-items:start;margin:0 auto}
.br-side{display:grid;grid-template-columns:repeat(4,165px);gap:10px;align-items:start}
.br-side-col{display:flex;flex-direction:column;gap:8px;justify-content:flex-start}
.br-col-title{font-size:10px;color:var(--faint);font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:2px 2px 6px;text-align:center}
.br-list{display:flex;flex-direction:column;gap:8px}
.br-side-col.r8 .br-list{gap:94px;padding-top:43px}
.br-side-col.rqf .br-list{gap:266px;padding-top:129px}
.br-side-col.rsf .br-list{padding-top:301px}
.br-center{display:flex;flex-direction:column;gap:14px;justify-content:flex-start;padding-top:301px}
.br-match{border:1px solid var(--line2);background:var(--card);border-radius:9px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.br-match{height:78px}
.br-mhead{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--line);font-size:10px;color:var(--faint);font-weight:700}
.br-score{color:var(--ink);font-weight:800}
.br-team{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:6px 8px;font-size:11px;font-weight:600}
.br-team+.br-team{border-top:1px solid var(--line)}
.br-team.win{background:var(--accent-soft);color:var(--ok)}
.br-name{display:flex;align-items:center;gap:6px;min-width:0}
.br-name span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-goals{width:14px;text-align:right;font-weight:800}

/* Bracket connectors: show how two matches feed the next round */
.br-side-col.r8 .br-match,
.br-side-col.rqf .br-match,
.br-side-col.rsf .br-match{position:relative}
.br-side.right .br-side-col.r8 .br-match::before,
.br-side.right .br-side-col.rqf .br-match::before,
.br-side.right .br-side-col.rsf .br-match::before{
  content:"";
  position:absolute;
  left:-16px;
  top:50%;
  width:16px;
  border-top:1px solid var(--line2);
}
.br-side.right .br-side-col.r8 .br-match::after,
.br-side.right .br-side-col.rqf .br-match::after,
.br-side.right .br-side-col.rsf .br-match::after{
  content:"";
  position:absolute;
  left:-16px;
  width:1px;
  background:var(--line2);
}
.br-side.left .br-side-col.r8 .br-match::before,
.br-side.left .br-side-col.rqf .br-match::before,
.br-side.left .br-side-col.rsf .br-match::before{
  content:"";
  position:absolute;
  right:-16px;
  top:50%;
  width:16px;
  border-top:1px solid var(--line2);
}
.br-side.left .br-side-col.r8 .br-match::after,
.br-side.left .br-side-col.rqf .br-match::after,
.br-side.left .br-side-col.rsf .br-match::after{
  content:"";
  position:absolute;
  right:-16px;
  width:1px;
  background:var(--line2);
}
.br-side.left .br-side-col.r8 .br-match::after,
.br-side.right .br-side-col.r8 .br-match::after{top:calc(50% - 47px);height:94px}
.br-side.left .br-side-col.rqf .br-match::after,
.br-side.right .br-side-col.rqf .br-match::after{top:calc(50% - 172px);height:344px}
.br-side.left .br-side-col.rsf .br-match::after,
.br-side.right .br-side-col.rsf .br-match::after{top:calc(50% - 172px);height:344px}

/* Keep semi-final to final gap visually symmetric: connectors come from the final card only */
.br-side.left .br-side-col.rsf .br-match::before,
.br-side.left .br-side-col.rsf .br-match::after,
.br-side.right .br-side-col.rsf .br-match::before,
.br-side.right .br-side-col.rsf .br-match::after{display:none}

.br-center .br-side-col.rf .br-match,
.br-center .br-side-col.r3 .br-match{position:relative}
.br-center .br-side-col.rf .br-match::before,
.br-center .br-side-col.rf .br-match::after,
.br-center .br-side-col.r3 .br-match::before,
.br-center .br-side-col.r3 .br-match::after{
  content:"";
  position:absolute;
  top:50%;
  width:24px;
  border-top:1px solid var(--line2);
}
.br-center .br-side-col.rf .br-match::before,
.br-center .br-side-col.r3 .br-match::before{left:-24px}
.br-center .br-side-col.rf .br-match::after,
.br-center .br-side-col.r3 .br-match::after{right:-24px}
.banner{margin:12px 18px 0;padding:11px 14px;border:1px solid var(--line2);border-radius:8px;background:#fbf6e9;color:#7a6420;font-size:11px;font-weight:500;display:none}
.banner.show{display:block}

const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

function matchDate(d){const [jj,mm]=d.split("/").map(Number);return new Date(2026,mm-1,jj);}
function dayLabel(d){const dt=matchDate(d);const nom=JOURS[dt.getDay()];const cap=nom.charAt(0).toUpperCase()+nom.slice(1);const [jj,mm]=d.split("/").map(Number);return `${cap} ${jj} ${MOIS[mm-1]}`;}
function isPastDay(d){const dt=matchDate(d);const today=new Date();today.setHours(0,0,0,0);return dt<today;}

function toMatchRow(m){return {id:m.id,date_match:toISODate(m.date),heure_match:`${m.h}:00`,phase:m.g?"Groupes":m.t,groupe:m.g||null,equipe_dom:m.e1,equipe_ext:m.e2,france:!!m.fr,score_dom:null,score_ext:null};}
async function ensureMatchsRows(){
  if(matchsSeeded)return;
  const {count,error}=await db.from("matchs").select("id",{count:"exact",head:true});
  if(error)throw error;
  if((count||0)===0){
    const rows=ALL.map(toMatchRow);
    const {error:insError}=await db.from("matchs").upsert(rows,{onConflict:"id"});
    if(insError)throw insError;
  }
  matchsSeeded=true;
}

async function loadAll(){
  setSync("busy");

    await ensureMatchsRows();
    const [pr,ma]=await Promise.all([db.from("pronostics").select("*"),db.from("matchs").select("id,resultat,score_dom,score_ext")]);
    if(pr.error)throw pr.error;if(ma.error)throw ma.error;
    votes={};
    pr.data.forEach(row=>{const i=PARTICIPANTS.indexOf(row.participant);if(i<0)return;if(!votes[row.match_id])votes[row.match_id]=[null,null,null,null];votes[row.match_id][i]=row.choix;});

    ma.data.forEach(row=>{results[row.id]=row.resultat;scoreMap[row.id]={s1:row.score_dom==null?"":String(row.score_dom),s2:row.score_ext==null?"":String(row.score_ext)};});
    setSync("ok");showBanner(null);

    setSync("off");
    showBanner("Connexion à la base impossible — vérifie Supabase et la table 'matchs'. Données non enregistrées tant que ce message s'affiche.");
    console.error(e);
  }
}

function getMajority(mv,sc){const c={};mv.forEach(v=>{if(v)c[v]=(c[v]||0)+1;});if(!Object.keys(c).length)return null;const mx=Math.max(...Object.values(c));const w=Object.keys(c).filter(k=>c[k]===mx);if(w.length===1)return w[0];let best=-1,bc=w[0];w.forEach(x=>PARTICIPANTS.forEach((p,i)=>{if(mv[i]===x&&(sc[p]||0)>best){best=sc[p]||0;bc=x;}}));return bc;}

function scoreOf(id){return scoreMap[id]||{s1:"",s2:""};}
function coteOf(id){return coteMap[id]==null?"":String(coteMap[id]);}
function winnerFromScore(s1,s2){if(s1===""||s2==="")return null;const a=Number(s1),b=Number(s2);if(Number.isNaN(a)||Number.isNaN(b))return null;return a===b?"N":(a>b?"1":"2");}
function groupTables(){
  const groups={};
  MG.forEach(m=>{if(!groups[m.g])groups[m.g]={};if(!groups[m.g][m.e1])groups[m.g][m.e1]={team:m.e1,pts:0,j:0,gf:0,ga:0,d:0};if(!groups[m.g][m.e2])groups[m.g][m.e2]={team:m.e2,pts:0,j:0,gf:0,ga:0,d:0};
    const s=scoreOf(m.id);if(s.s1===""||s.s2==="")return;const a=Number(s.s1),b=Number(s.s2);if(Number.isNaN(a)||Number.isNaN(b))return;
    const t1=groups[m.g][m.e1],t2=groups[m.g][m.e2];
    t1.j++;t2.j++;t1.gf+=a;t1.ga+=b;t2.gf+=b;t2.ga+=a;t1.d=t1.gf-t1.ga;t2.d=t2.gf-t2.ga;

  const sorted={};

  return sorted;
}
function buildKnockoutProjection(tables){
  const first={},second={},third=[];
  Object.keys(tables).forEach(g=>{const arr=tables[g];if(arr[0])first[g]=arr[0].team;if(arr[1])second[g]=arr[1].team;if(arr[2])third.push({group:g,...arr[2]});});
  const bestThirdEntries=third.sort((a,b)=>b.pts-a.pts||b.d-a.d||b.gf-a.gf||a.team.localeCompare(b.team)).slice(0,8);
  const bestThirdRanking=bestThirdEntries.map(x=>x.team);
  const ctx={first,second,bestThirdEntries,usedThirdGroups:new Set(),winners:{},losers:{}};
  const fixtures=MKO.map(m=>{
    const e1=resolveKoLabel(m.e1,ctx);
    const e2=resolveKoLabel(m.e2,ctx);
    const s=scoreOf(m.id);
    const hasScore=s.s1!==""&&s.s2!=="";
    if(hasScore){
      const a=Number(s.s1),b=Number(s.s2);
      if(!Number.isNaN(a)&&!Number.isNaN(b)&&a!==b){
        ctx.winners[m.id]=a>b?e1:e2;
        ctx.losers[m.id]=a>b?e2:e1;
      }
    }
    return {id:m.id,round:m.t,date:m.date,h:m.h,e1,e2,s1:s.s1,s2:s.s2};

function resolveKoLabel(lbl,ctx){
  if(lbl.startsWith("1er Gr.")){const g=lbl.replace("1er Gr.","");return ctx.first[g]||lbl;}
  if(lbl.startsWith("2e Gr.")){const g=lbl.replace("2e Gr.","");return ctx.second[g]||lbl;}
  if(/^3[A-L]+$/.test(lbl)){
    const allowed=new Set(lbl.slice(1).split(""));
    const pick=ctx.bestThirdEntries.find(x=>allowed.has(x.group)&&!ctx.usedThirdGroups.has(x.group));
    if(pick){ctx.usedThirdGroups.add(pick.group);return pick.team;}
    return lbl;
  }
  if(lbl.startsWith("V.M")){const id=Number(lbl.replace("V.M",""));return ctx.winners[id]||lbl;}
  if(lbl.startsWith("Perdant M")){const id=Number(lbl.replace("Perdant M",""));return ctx.losers[id]||lbl;}
  return lbl;
}

  const groupHtml=Object.keys(tables).map(g=>`<div class="gcard"><div class="ghead">Groupe ${g}</div>${tables[g].map((t,i)=>`<div class="grow"><span class="gpos">${i+1}</span><span class="gteam">${flagImg(t.team,"flag-sm")}<span>${t.team}</span></span><span class="gnum">${t.pts}</span><span class="gnum">${t.d}</span><span class="gnum">${t.gf}</span><span class="gnum">${t.j}</span></div>`).join('')}</div>`).join('');
  const thirdLine=kval.bestThirdRanking.length?`<div class="ko-line"><b>3e meilleurs</b>${kval.bestThirdRanking.join(" · ")}</div>`:"";
  const filters=`<div class="scroller">${phases.map(p=>`<button class="chip ${filterPhase===p?'on':''}" onclick="setPhase('${p}')">${p==="Groupes"?"Phase de groupes":p==="FINALE"?"Finale":p}</button>`).join('')}</div>${filterPhase==="Groupes"?`<div class="scroller sub">${groups.map(g=>`<button class="chip ${filterGroupe===g?'on':''}" onclick="setGroupe('${g}')">${g==="Tous"?"Tous":g==="France"?"France":"Gr. "+g}</button>`).join('')}</div>`:''}<div class="datebar"><span class="datebar-lbl">📅 Aller à</span><select class="datesel" onchange="setFilterDate(this.value)"><option value="Toutes" ${filterDate==="Toutes"?'selected':''}>Toutes les dates</option>${dates.map(d=>`<option value="${d}" ${filterDate===d?'selected':''}>${dayLabel(d)}</option>`).join('')}</select>${filterDate!=="Toutes"?`<button class="datereset" onclick="setFilterDate('Toutes')">✕</button>`:''}</div>`;
  return `${filters}<div class="slabel"><span class="slabel-text">Saisie des scores</span><span class="slabel-line"></span><span class="slabel-count">${matches.length} matchs</span></div>${mRows}<div class="slabel"><span class="slabel-text">Classements groupes</span><span class="slabel-line"></span><span class="slabel-count">Pts / Diff / BP / J</span></div><div class="group-grid">${groupHtml}</div><div class="slabel"><span class="slabel-text">Phase éliminatoire</span><span class="slabel-line"></span></div>${thirdLine}${renderKnockout(kval.fixtures)}<div style="height:18px"></div>`;
}

window.setMe=function(p){me=(me===p?null:p);if(me)localStorage.setItem("cdm26_me",me);else localStorage.removeItem("cdm26_me");render();};
// Repliage : on ne redessine QUE le contenu, en préservant la position de scroll
function renderMatchsOnly(){const sc=computeScores();const c=document.getElementById("content");const y=c.scrollTop;c.innerHTML=renderMatchs(sc);c.scrollTop=y;}
window.toggleDay=function(lbl){openDays[lbl]=!openDays[lbl];renderMatchsOnly();};
window.setFilterDate=function(d){filterDate=d;
  if(tab==="matchs"){
    // En filtrant sur une date, on ouvre cette journée automatiquement
    if(d!=="Toutes"){openDays[dayLabel(d)]=true;}
    const c=document.getElementById("content");if(c)c.scrollTop=0;
    renderMatchsOnly();
    return;
  }
  const c=document.getElementById("content");if(c)c.scrollTop=0;
  render();
};
window.setScoreDraft=function(id,key,val,el){
  if(!scoreMap[id])scoreMap[id]={s1:"",s2:""};
  const cleaned=String(val).replace(/[^0-9]/g,"");
  scoreMap[id][key]=cleaned;
  if(el&&el.value!==cleaned)el.value=cleaned;

  const card=el?el.closest(".admin-card"):null;
  const scoreBox=el?el.closest(".m-score"):null;
  const filled=scoreMap[id].s1!==""&&scoreMap[id].s2!=="";
  if(card)card.classList.toggle("filled",filled);
  if(scoreBox)scoreBox.classList.toggle("filled",filled);

  if(scoreSaveTimers[id])clearTimeout(scoreSaveTimers[id]);
  if(filled){
    scoreSaveTimers[id]=setTimeout(()=>saveScore(id),450);
  }
};
window.setCoteDraft=function(id,val,el){
  let cleaned=String(val).replace(/,/g,'.').replace(/[^0-9.]/g,'');
  const p=cleaned.split('.');
  if(p.length>2)cleaned=`${p.shift()}.${p.join('')}`;
  coteMap[id]=cleaned;
  if(!cleaned)delete coteMap[id];
  localStorage.setItem("cdm26_cotes",JSON.stringify(coteMap));
  if(el&&el.value!==cleaned)el.value=cleaned;
  if(tab==="matchs")renderMatchsOnly();
  else render();
};
window.saveScore=async function(id){
  const s=scoreOf(id);
  if(s.s1===""||s.s2==="")return;
  scoreMap[id]={s1:String(Math.max(0,parseInt(s.s1,10)||0)),s2:String(Math.max(0,parseInt(s.s2,10)||0))};
  const s1=Number(scoreMap[id].s1),s2=Number(scoreMap[id].s2);
  results[id]=winnerFromScore(scoreMap[id].s1,scoreMap[id].s2);
  render();setSync("busy");
  try{
    const {error}=await db.from("matchs").update({score_dom:s1,score_ext:s2}).eq("id",id);
    if(error)throw error;
    setSync("ok");showBanner(null);
  }catch(e){setSync("off");showBanner("Échec de l'enregistrement — base injoignable.");console.error(e);} 
};
window.vote=async function(id,pi,v){
  if(me!==PARTICIPANTS[pi])return;
  const cur=votes[id]?[...votes[id]]:[null,null,null,null];
  const newv=cur[pi]===v?null:v;cur[pi]=newv;votes[id]=cur;render();
  setSync("busy");
  try{
    if(newv===null){const {error}=await db.from("pronostics").delete().match({match_id:id,participant:PARTICIPANTS[pi]});if(error)throw error;}
    else{const {error}=await db.from("pronostics").upsert({match_id:id,participant:PARTICIPANTS[pi],choix:newv});if(error)throw error;}
    setSync("ok");showBanner(null);
  }catch(e){setSync("off");showBanner("Échec de l'enregistrement — base injoignable.");console.error(e);}
};
window.setResult=async function(id,v){
  results[id]=v||null;render();setSync("busy");
  try{
    let score_dom=null,score_ext=null;
    if(v==="1"){score_dom=1;score_ext=0;}
    else if(v==="2"){score_dom=0;score_ext=1;}
    else if(v==="N"){score_dom=0;score_ext=0;}
    scoreMap[id]={s1:score_dom==null?"":String(score_dom),s2:score_ext==null?"":String(score_ext)};
    const {error}=await db.from("matchs").update({score_dom,score_ext}).eq("id",id);
    if(error)throw error;
    setSync("ok");showBanner(null);
  }catch(e){setSync("off");showBanner("Échec de l'enregistrement — base injoignable.");console.error(e);}
};
window.setTab=function(t){if(t==="resultats")t="matchs";tab=t;document.querySelectorAll(".nbtn").forEach(b=>b.classList.remove("on"));const nav=document.getElementById("nav-"+t);if(nav)nav.classList.add("on");document.querySelector(".app").classList.toggle("wide",t==="competition");document.getElementById("content").scrollTop=0;render();};
window.setPhase=function(p){filterPhase=p;render();};
window.setGroupe=function(g){filterGroupe=g;render();};

// Rafraîchit les données puis redessine SANS casser le scroll ni les sections ouvertes
async function softRefresh(){
  const c=document.getElementById("content");
  const y=c?c.scrollTop:0;
  await loadAll();
  if(tab==="matchs"){const sc=computeScores();renderWho();renderBoard(sc);c.innerHTML=renderMatchs(sc);c.scrollTop=y;}
  else render();
}

async function refresh(){
  await loadAll();
  if(!collapseInit){
    collapseInit=true;
    // On regroupe tous les matchs (groupes + finales) par jour, dans l'ordre chrono
    const byDay={};const order=[];
    ALL.forEach(m=>{const l=dayLabel(m.date);if(!byDay[l]){byDay[l]=[];order.push(l);}byDay[l].push(m);});
    // Journée cible : la 1re qui n'est PAS passée et dont au moins un match n'a pas de résultat.
    // À défaut (tournoi fini), on ouvre la dernière journée.
    let target=order.find(l=>{
      const ms=byDay[l];
      const past=isPastDay(ms[0].date);
      const allDone=ms.every(m=>results[m.id]);
      return !past && !allDone;
    });
    if(!target) target=order.find(l=>byDay[l].some(m=>!results[m.id]))||order[order.length-1];
    if(target)openDays[target]=true;
  }
  render();
}

// ── Temps réel : on écoute les changements et on rafraîchit aussitôt ──
function subscribeRealtime(){
  db.channel("cdm26")
    .on("postgres_changes",{event:"*",schema:"public",table:"pronostics"},softRefresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"matchs"},softRefresh)
    .subscribe();
}

refresh();
subscribeRealtime();
setInterval(refresh,20000); // filet de sécurité si le temps réel se coupe
</script>
